    if (node && node.nodeType === 1 && node.tagName === "CODE") {
      const t = node.textContent.trim();
      if (/^\d+$/.test(t)) line = parseInt(t, 10);
    } else if (node && node.nodeType === 3) {
      const m = node.textContent.match(/^\s*`(\d+)`/);
      if (m) line = parseInt(m[1], 10);
    }
    // href 里的 GitHub 风格锚点 #L数字（[File.java](path#L925)）：拆出路径与行号。
    // 路径干净后再走 isCodeFile；行号仅在反引号数字缺失时作 fallback。
    let anchorLine = null;
    const anchorM = href.match(/#L(\d+)\s*$/);
    if (anchorM) {
      anchorLine = parseInt(anchorM[1], 10);
      href = href.slice(0, anchorM.index);
    }
    const abs = resolveRel(mdPath, href);
    if (line == null) line = anchorLine;
    const lkind = tabKindForPath(abs);
    if (lkind === "code") {
      a.classList.add("code-jump");
      a.title = "打开代码: " + abs + (line ? " :" + line : "") + "（Ctrl+点击开为标签页）";
      a.textContent = a.textContent.replace(/\s*`?\d+`?\s*$/, "") || abs.split("/").pop();
      if (line) {
        const span = document.createElement("span");
        span.className = "cj-line"; span.textContent = line;
        a.appendChild(span);
      }
      a.addEventListener("click", (e) => {
        e.preventDefault();
        pushNav(abs, line);
        if (e.ctrlKey || e.metaKey) openTab(abs, { line });
        else openCodeModal(abs, line);
      });
    } else if (lkind === "md") {
      a.classList.add("md-jump");
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openTab(abs);
      });
    } else if (lkind === "html" || lkind === "image") {
      a.classList.add(lkind === "html" ? "html-jump" : "img-jump");
      a.title = "打开: " + abs;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openTab(abs);
      });
    } else {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("/api/raw?path=" + encodeURIComponent(abs), "_blank");
      });
    }
  });
  // mermaid 渲染
  renderMermaid();
  // 标注语言的代码块做语法高亮（mermaid 已单独处理）
  highlightCodeBlocks();
  // 反引号里的裸路径 → 可点击链接（md / 代码 / 资源）
  linkifyPaths(mdPath);
  // 恢复当前标签滚动位置（mermaid 是异步收集的，分多点校正直到视口图插入完成）
  const act = curActiveTab();
  if (act) {
    _pendingRestore = { tabId: act.id, target: act.scrollTop || 0 };
    applyPendingRestore();
    setTimeout(applyPendingRestore, 30);
    setTimeout(applyPendingRestore, 150);
    setTimeout(applyPendingRestore, 500);
  }
}

/* 正文反引号里的裸文件路径识别为可点击链接。
   匹配形如 `docs/梳理/xxx.md`、`gits/xx.java` 的路径（含中文/相对段），
   用 /api/exists 批量验证存在性，存在则转为链接：
   - .md → 新 tab 打开（md-jump）
   - 代码扩展名 → 代码弹窗（code-jump）
   - 其他 → /api/raw 打开
   已存在的标准链接（a[href]）不受影响。 */
async function linkifyPaths(mdPath) {
  const box = $("#content .md-body");
  if (!box) return;
  const codes = box.querySelectorAll("code");
  if (!codes.length) return;
  // 路径正则：非空白/分隔符串 + 已知扩展名（含中文路径段、裸文件名、目录前缀）
  const PATH_RE = /[^\s`"'<>|，。、；：]+\.(?:md|java|xml|py|js|ts|jsx|tsx|sql|yml|yaml|json|properties|sh|bat|cmd|gradle|html|css|kt|go|c|cpp|h|vue|ini|cfg|txt|xlsx|png|jpe?g|gif|svg|webp|bmp|ico|avif|docx)(?![A-Za-z0-9])/g;
  const cand = new Map(); // code 元素 -> [{raw, abs}]
  const all = new Set();
  const EXT_RE = /\.(?:md|java|xml|py|js|ts|jsx|tsx|sql|yml|yaml|json|properties|sh|bat|cmd|gradle|html|css|kt|go|c|cpp|h|vue|ini|cfg|txt|xlsx|png|jpe?g|gif|svg|webp|bmp|ico|avif|docx)(?![A-Za-z0-9])/;
  codes.forEach(code => {
    if (code.closest("pre")) return;            // 跳过代码块（整块高亮，非引用）
    if (code.closest("a")) return;              // 已是链接
    const t = code.textContent;
    // 快速预过滤：无扩展名 / 太短 → 不可能是文件路径（行号 `582`、普通词直接跳过）
    if (t.length < 5 || !EXT_RE.test(t) || !t.includes(".")) return;
    const list = [];
    let m;
    while ((m = PATH_RE.exec(t))) {
      const raw = m[0].replace(/[，。、；：]+$/, "");
      // 兼容裸路径带 #L数字 锚点（如 `xxx.java#L925`）：路径与行号拆开
      const am = raw.match(/#L(\d+)\s*$/);
      const anchor = am ? parseInt(am[1], 10) : null;
      const clean = am ? raw.slice(0, am.index) : raw;
      const abs = resolveRel(mdPath, clean);
      if (!all.has(abs)) { all.add(abs); list.push({ raw, abs, anchor }); }
    }
    if (list.length) cand.set(code, list);
  });
  if (!all.size) return;
  let exists = {};
  try {
    const r = await fetch("/api/exists?" + [...all].map(p => "path=" + encodeURIComponent(p)).join("&"));
    exists = (await r.json()).exists || {};
  } catch (e) { return; }
  cand.forEach((list, code) => {
    list.forEach(({ raw, abs, anchor }) => {
      const info = exists[abs];
      if (!info || !info.exists) return;
      splitNodeWithText(code, raw, info.abs, anchor);
    });
  });
}

/* 在 code 的文本节点中按原始文本切分，把匹配片段替换为可点击链接节点 */
function splitNodeWithText(code, raw, abs, anchor = null) {
  const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    const i = node.textContent.indexOf(raw);
    if (i < 0) continue;
    const rest = node.textContent.slice(i + raw.length);
    node.textContent = node.textContent.slice(0, i);
    const a = document.createElement("a");
    a.href = "#";
    a.dataset.abs = abs;
    a.title = abs + (anchor ? " :" + anchor : "");
    a.textContent = raw;
    const lkind = tabKindForPath(abs);
    if (lkind === "md") a.className = "md-jump";
    else if (lkind === "code") a.className = "code-jump";
    else if (lkind === "html") a.className = "html-jump";
    else if (lkind === "image") a.className = "img-jump";
    a.addEventListener("click", (e) => {
      e.preventDefault();
      if (a.classList.contains("md-jump")) openTab(abs);
      else if (a.classList.contains("code-jump")) {
        e.preventDefault();
        pushNav(abs, anchor);
        if (e.ctrlKey || e.metaKey) openTab(abs, { line: anchor });
        else openCodeModal(abs, anchor);
      }
      else if (a.classList.contains("html-jump") || a.classList.contains("img-jump")) openTab(abs);
      else window.open("/api/raw?path=" + encodeURIComponent(abs), "_blank");
    });
    node.parentNode.insertBefore(a, node.nextSibling);
    if (rest) {
      const tail = document.createTextNode(rest);
      node.parentNode.insertBefore(tail, a.nextSibling);
    }
    return;
  }
}

/* 代码块语言名归一化：把 ```lang 里常见的非 hljs 名称/别名映射到 highlight.js 支持的语言名。
   vendor/highlight.min.js 是 common 包（含 bash/css/go/javascript/php/python/ruby/sql/swift/xml/c/cpp/csharp/kotlin/markdown/ini 等）。
   vue/svelte 等框架模板走 xml 高亮（hljs 无独立 vue 语言）；未收录的语言返回 "" 表示不高亮（保持原文）。*/
const HLJS_LANG_ALIAS = {
  // 前端框架模板 → xml（hljs 无 vue/svelte 语言，模板语法最接近）
  vue: "xml", svelte: "xml", astro: "xml", angular: "xml", hbs: "xml", handlebars: "xml",
  pug: "xml", ejs: "xml", jsp: "xml", thymeleaf: "xml",
  html: "xml", htm: "xml", svg: "xml", xhtml: "xml",
  js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "javascript", node: "javascript",
  ts: "typescript", tsx: "typescript", mts: "typescript", cts: "typescript",
  py: "python", py3: "python", python3: "python", ipython: "python", gyp: "python", pycon: "python",
  rb: "ruby", gemspec: "ruby", podspec: "ruby",
  yml: "yaml", sh: "bash", shell: "bash", zsh: "bash", console: "bash",
  golang: "go", rs: "rust", kt: "kotlin", kts: "kotlin", cs: "csharp", "c#": "csharp",
  "c++": "cpp", cpp: "cpp", hpp: "cpp", "h++": "cpp", hh: "cpp", cc: "cpp",
  objc: "objectivec", "obj-c": "objectivec",
  bat: "dos", cmd: "dos", dos: "dos", ps1: "powershell", powershell: "powershell",
  patch: "diff", md: "markdown", markdown: "markdown", jsonc: "json", json5: "json",
  text: "", txt: "", plaintext: "", plain: "", mermaid: "", ini: "ini", properties: "ini",
};

/* 归一化：返回 hljs 可用语言名；无法识别返回 ""（调用方跳过高亮，保持原文） */
function hljsLang(lang) {
  if (!lang || typeof hljs === "undefined" || !hljs.getLanguage) return "";
  const raw = String(lang).trim().toLowerCase().replace(/^\./, "");
  if (!raw) return "";
  if (hljs.getLanguage(raw)) return raw;      // 已是 hljs 语言名/别名
  const mapped = HLJS_LANG_ALIAS[raw];
  if (mapped && hljs.getLanguage(mapped)) return mapped;
  return "";
}

/* md 正文中带 ```lang 标注的代码块 → hljs 语法高亮（无标注保持原样） */
function highlightCodeBlocks() {
  if (typeof hljs === "undefined") return;
  const blocks = [...document.querySelectorAll("#content .md-body pre code[class*='language-']")];
  if (!blocks.length) return;
  // 分片执行：大文档 600+ 代码块同步 hljs 会阻塞主线程数百 ms。
  // 按「字符预算」分片而非固定块数——代码块大小极不均衡（大块单块数百 ms），
  // 固定 30 块/片会在撞上大块时仍卡住。每片预算 ~60ms 工作量，摊到多帧。
  const SLICE_BUDGET = 60;   // ms
  let i = 0;
  const step = () => {
    const t0 = performance.now();
    for (; i < blocks.length; i++) {
      const code = blocks[i];
      const cls = (code.className || "").split(" ").find(c => c.startsWith("language-"));
      const lang = cls ? cls.replace("language-", "") : "";
      if (!lang || lang === "mermaid") continue;
      if (!code.closest("pre")) continue;
      const hl = hljsLang(lang);          // 归一化：vue→xml、js→javascript 等
      if (!hl) continue;                  // 未收录语言 → 保持原文不高亮
      try {
        code.innerHTML = hljs.highlight(code.textContent, { language: hl, ignoreIllegals: true }).value;
        code.classList.add("hljs");
      } catch (e) { /* 保留原文 */ }
      // 单个大块超预算时也要让出主线程（当前块已处理完）
      if (performance.now() - t0 > SLICE_BUDGET) break;
    }
    if (i < blocks.length) setTimeout(step, 16);
  };
  setTimeout(step, 0);
}

/* mermaid 渲染：服务端渲染，浏览器零负担。
   mermaid.min.js 是 2MB+ 重库，在浏览器里跑 dagre 布局 + SVG 生成会吃满 CPU/内存，
   导致整个电脑卡顿。改为：收集文档所有 mermaid 源码 → POST /api/mermaid/render
   （后端用 node + puppeteer 批量渲染，复用一次浏览器，85 图约 5 秒）→ 拿回 SVG。
   前端只做「视口内插入 SVG」——插入是毫秒级，无渲染计算，滚动零卡顿。 */
const __perfLog = [];   // 前端性能日志（诊断卡顿用）
function perfLog(msg) {
  __perfLog.push((performance.now() | 0) + "ms " + msg);
  if (window.console && console.debug) console.debug("[perf]", msg);
}
// 每 10s 把性能日志上报后端（写到 mdreader.log），供离线诊断
setInterval(() => {
  if (!__perfLog.length) return;
  const batch = __perfLog.splice(0);
  fetch("/api/perf-log", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lines: batch }),
  }).catch(() => {});
}, 10000);

/* 标记「已拿到 svg 但尚未插入」的图为等视口状态：
   占位文案区分两种情况——还没拿到 svg（渲染中…）vs 已拿到 svg 仅在等用户滚动（滚动到此处显示）。 */
function markMermaidWait(divs, svgByDiv) {
  divs.forEach((d, i) => {
    const r = svgByDiv[i];
    if (r && r.svg && !d.classList.contains("rendered") && !d.classList.contains("mmd-err")) {
      d.classList.add("mmd-wait");
    }
  });
}

let mmdState = [];             // [{div, res}] 当前 #content 内 mermaid 图快照（服务端结果/补图后更新）
let _pendingRestore = null;    // {tabId, target} 待恢复的滚动位置（mermaid 补图后多点校正）

async function renderMermaid() {
  const mdTab = curActiveTab();   // 本次渲染所属 tab（fetch 异步期间用户可能切走，恢复渲染时核对）
  const blocks = document.querySelectorAll("#content pre code.language-mermaid, #content .md-body code.language-mermaid");
  if (!blocks.length) return;
  const content = document.querySelector("#content");
  const divs = [];
  for (const b of blocks) {
    const pre = b.closest("pre");
    const div = document.createElement("div");
    div.className = "mermaid";
    div.dataset.mmdSrc = b.textContent;   // 保存源码：切走切回恢复已渲染图用（insertSvgAsImg 会清空 textContent）
    div.textContent = b.textContent;
    pre.replaceWith(div);
    divs.push(div);
  }
  perfLog("renderMermaid: 收集 " + divs.length + " 个图, 请求后端");
  // 收集源码 → 一次请求后端渲染（按内容 hash 缓存，重复打开秒回）
  const items = divs.map((d, i) => ({ id: "m" + i, src: d.textContent }));
  let results = {}, pendingList = [];
  try {
    const t0 = performance.now();
    const r = await fetch("/api/mermaid/render", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items }),
    });
    const j = await r.json();
    results = j.results || {};
    pendingList = j.pending || [];
    perfLog("renderMermaid: 后端返回 " + Object.keys(results).length + " 图, pending " + pendingList.length + ", 耗时 " + Math.round(performance.now() - t0) + "ms");
    // 有未渲染的图：异步轮询直到全部拿到（后端渲染线程完成后缓存命中）
    if (pendingList.length) {
      pollPending(items, pendingList).then(more => {
        results = Object.assign({}, results, more);
        // 更新快照，IO 懒插入（滚动进入时）能取到补的图
        svgByDiv = divs.map((d, i) => results["m" + i] || null);
        markMermaidWait(divs, svgByDiv);   // 补齐后未插入的图 → "滚动到此处显示"
        // 视口内的补齐图立即插入（IO 可能已经掠过它们）
        applyMermaidSvgsInView(divs, more);
        mmdState = divs.map((d, i) => ({ div: d, res: results["m" + i] || null }));
        restoreRenderedMermaid(divs, results, mdTab);   // 补齐后恢复「切走前已渲染的图」（高度先复原）
        // 轮询补齐可能发生在数秒后：不强制把滚动拉回旧目标（用户可能已滚动），
        // 只做带 ±150px 保护的恢复 + 补插视口图（不依赖 _pendingRestore）
        forceRestoreAndFlush();
        perfLog("renderMermaid: 轮询补齐 " + Object.keys(more).length + " 图");
      });
    }
  } catch (e) {
    // 后端不可用：保留占位并提示
    perfLog("renderMermaid: 后端请求失败 " + e.message);
    divs.forEach(d => {
      d.classList.add("mmd-err");
      d.title = "mermaid 服务端渲染不可用";
    });
    return;
  }
  let svgByDiv = divs.map((d, i) => results["m" + i] || null);
  markMermaidWait(divs, svgByDiv);   // 已拿到 svg 但未插入的图 → 占位显示"滚动到此处显示"
  mmdState = divs.map((d, i) => ({ div: d, res: results["m" + i] || null }));
  restoreRenderedMermaid(divs, results, mdTab);   // 先恢复「切走前已渲染的图」→ 文档高度复原，scrollTop 才不被 clamp
  applyPendingRestore();   // 服务端结果已回：恢复滚动位置并主动补插视口内的图
  forceRestoreAndFlush();  // 兜底：不依赖 _pendingRestore 是否被过早清空，强制补插视口图
  if (!("IntersectionObserver" in window)) {
    // 降级：全部直接插入（img 方式，毫秒级）
    const t0 = performance.now();
    svgByDiv.forEach((res, i) => {
      const d = divs[i];
      if (res && res.svg) { insertSvgAsImg(d, res.svg); }
      else if (res && res.error) { d.classList.add("mmd-err"); d.title = "mermaid 渲染失败: " + res.error; }
    });
    perfLog("renderMermaid: 降级全量插入 " + divs.length + " 图, 耗时 " + Math.round(performance.now() - t0) + "ms");
    return;
  }
  // IO 懒插入：只把视口附近（+150px buffer）的图插入 DOM。
  // 图进入视口 → 插入（img 方式，毫秒级）；滚出视口 → 不处理（不销毁，DOM 保留）。
  let insertCount = 0, insertTotalMs = 0;
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const div = en.target;
      if (div.classList.contains("rendered") || div.classList.contains("mmd-err")) return;
      if (div.querySelector("img")) return;   // 已有 img（恢复渲染已插入，onload 未完成）→ 不重复插
      const i = divs.indexOf(div);
      const res = svgByDiv[i];
      if (res && res.svg) {
        io.unobserve(div);   // 已拿到 svg 且进入视口 → 真正插入后才取消观察
        const t0 = performance.now();
        insertSvgAsImg(div, res.svg);
        const dt = performance.now() - t0;
        insertCount++; insertTotalMs += dt;
        if (insertCount % 10 === 0) perfLog("renderMermaid: 已插入 " + insertCount + " 图, 累计耗时 " + Math.round(insertTotalMs) + "ms");
      }
      else if (res && res.error) {
        io.unobserve(div);   // 已确定为错误 → 取消观察，不再重试
        div.classList.add("mmd-err"); div.title = "mermaid 渲染失败: " + res.error;
      }
      // res 为 null（服务端仍在渲染/轮询未补齐）：不 unobserve，保持观察，
      // 等 svgByDiv 补齐后下次进入视口重试（否则图会永久卡在占位）
    });
  }, { root: content, rootMargin: "150px 0px" });
  divs.forEach(d => io.observe(d));
  perfLog("renderMermaid: IO 已注册, 等待滚动触发插入");
}

/* 把 SVG 作为 <img data-url> 插入（不是内联 <svg>）：
   SVG-as-image 是标准隔离机制——内嵌 <style> 不参与全局样式计算、SVG 节点不进 DOM
   （1 个 img 替代几百个 SVG 节点）、滚动 layout 极轻。这是 85 个图滚动卡顿的根治。
   尺寸：SVG 内联时受 style max-width 约束（如 324.5px）；img 没有 viewBox 概念，
   需解析 viewBox 得到设计宽高，设置 img 宽度 = viewBox 宽（height auto 保持比例），
   并受容器 max-width:100% 约束（小图不大，大图不溢出）。 */
function insertSvgAsImg(div, svg) {
  const m = svg.match(/viewBox=["']([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)["']/);
  const vbW = m ? parseFloat(m[3]) : null;
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  const img = new Image();
  img.className = "mmd-img";
  img.alt = "mermaid 图";
  if (vbW) img.style.width = vbW + "px";   // 按设计宽度显示（height auto 等比）
  img.onload = () => {
    div.classList.add("rendered");
    mmdZoomAddButton(div);   // 渲染成功 → 右上角加全屏查看按钮
    // 恢复场景：img 高度定型后校正滚动位置（restoreRenderedMermaid 标记的图才会走到这里）。
    // 幂等：__restoring 校正一次即清；flush/IO 会跳过已 rendered / 已有 img 的 div，不会循环。
    if (div.__restoring) {
      div.__restoring = false;
      if (_pendingRestore) applyPendingRestore();   // 恢复窗口内：按精确目标恢复
      else forceRestoreAndFlush();                  // 窗口外：带 ±150 保护
    }
  };
  img.onerror = () => {
    div.classList.add("mmd-err");
    div.title = "SVG 图片加载失败";
  };
  div.textContent = "";   // 清掉占位 div 里的源码文本，避免源码与图片同时显示
  div.appendChild(img);
  img.src = url;
}

/* 轮询后端直到 pending 的图渲染完成（渲染线程在后台跑，缓存落盘后命中） */
async function pollPending(items, pendingIds) {
  const wanted = new Set(pendingIds);
  for (let i = 0; i < 30 && wanted.size; i++) {   // 最多等 60s
    await new Promise(r => setTimeout(r, 2000));
    const req = items.filter(it => wanted.has(it.id));
    if (!req.length) break;
    try {
      const r = await fetch("/api/mermaid/render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: req }),
      });
      const j = await r.json();
      const got = j.results || {};
      for (const k of Object.keys(got)) if (wanted.has(k)) wanted.delete(k);
      if (Object.keys(got).length) return got;
    } catch (e) { /* 继续等 */ }
  }
  return {};
}

/* 轮询补齐的图：只插入「当前在视口附近」的（已渲染的直接显示，未在视口的
   由 IO 懒插入在滚动进入时处理——注意 IO 已注册，但补齐发生在 IO 注册之后，
   所以这里手动检查一次视口位置，避免补的图永远不显示） */
function applyMermaidSvgsInView(divs, results) {
  const content = document.querySelector("#content");
  divs.forEach((d, i) => {
    if (d.classList.contains("rendered") || d.classList.contains("mmd-err")) return;
    if (d.querySelector("img")) return;   // 恢复渲染已插入的图不重复插
    const res = results["m" + i];
    if (!res) return;
    // 视口检查：相对 content 滚动容器（content 是定位祖先吗？不是——用 getBoundingClientRect 差值）
    if (content) {
      const cr = content.getBoundingClientRect();
      const dr = d.getBoundingClientRect();
      if (dr.bottom < cr.top - 150 || dr.top > cr.bottom + 150) return;  // 不在视口附近，留给 IO
    }
    if (res.svg) { insertSvgAsImg(d, res.svg); }
    else if (res.error) { d.classList.add("mmd-err"); d.title = "mermaid 渲染失败: " + res.error; }
  });
}

/* 切走再切回：把「切走前已 rendered 的图」直接恢复渲染（跳过视口判定），
   使文档高度先复原、scrollTop 恢复不被 clamp；未看过的图保持 mmd-wait，仍走 IO 懒加载。
   幂等：与 flush/IO 一样先查 rendered / mmd-err / 已有 img。 */
function restoreRenderedMermaid(divs, results, mdTab) {
  if (!mdTab || !curActiveTab() || curActiveTab().id !== mdTab.id) return 0;
  const seen = Array.isArray(mdTab.mmdRendered) ? new Set(mdTab.mmdRendered) : null;
  if (!seen || !seen.size) return 0;
  let restored = 0;
  divs.forEach((d, i) => {
    if (!d.isConnected) return;   // fetch 期间用户切走 → 本批 div 已脱离 DOM，跳过
    if (d.classList.contains("rendered") || d.classList.contains("mmd-err")) return;
    if (d.querySelector("img")) return;
    const res = results["m" + i];
    if (!seen.has(d.dataset.mmdSrc)) return;   // 未看过的图 → 留给 IO 懒加载
    if (res && res.svg) {
      d.classList.remove("mmd-wait");
      d.__restoring = true;   // img.onload 高度定型后校正滚动（校正一次即清，幂等）
      insertSvgAsImg(d, res.svg);
      restored++;
    } else if (res && res.error) {
      d.classList.add("mmd-err"); d.title = "mermaid 渲染失败: " + res.error;
    }
  });
  return restored;
}

/* 主动检查视口附近的 mermaid 图并立即插入（scrollTop 恢复瞬移后 IO 可能不触发，历史坑）。
   返回本次插入的图数量。 */
function flushMermaidInView() {
  let inserted = 0;
  const content = document.querySelector("#content");
  if (!content) return 0;
  const cr = content.getBoundingClientRect();
  mmdState.forEach(({ div, res }) => {
    if (!res) return;
    if (div.classList.contains("rendered") || div.classList.contains("mmd-err")) return;
    if (div.querySelector("img")) return;   // 恢复渲染已插入的图不重复插
    if (!div.isConnected) return;
    const dr = div.getBoundingClientRect();
    if (dr.bottom < cr.top - 150 || dr.top > cr.bottom + 150) return;   // 不在视口附近，留给 IO
    if (res.svg) { insertSvgAsImg(div, res.svg); inserted++; }
    else if (res.error) { div.classList.add("mmd-err"); div.title = "mermaid 渲染失败: " + res.error; }
  });
  return inserted;
}

/* 应用待恢复的滚动位置（renderContent/renderMermaid 多点触发）：
   先设 scrollTop，再主动补插视口内 mermaid 图；图插入使高度变化后由后续触发再次校正，
   直到「位置到位 + 视口图都插入」才结束。 */
function applyPendingRestore() {
  const p = _pendingRestore;
  if (!p) return;
  const task = curTask();
  if (!task || task.activeTabId !== p.tabId) { _pendingRestore = null; return; }
  const c = $("#content");
  if (!c) return;
  c.scrollTop = p.target;
  const inserted = flushMermaidInView();
  const settled = Math.abs(c.scrollTop - p.target) <= 1;
  // 本 tab 没有任何 mermaid 图 → 位置到位即收敛（无需等异步结果）
  if (inserted === 0 && settled && !c.querySelector(".mermaid")) {
    _pendingRestore = null;
    return;
  }
  // 收敛：仅当本 tab 的 mermaid 结果已就绪（mmdState 里有已连接的 div 且都拿到 res）
  // 且视口内无待插图、位置到位时才清空 _pendingRestore。
  // 否则（fetch 未返回 / mmdState 还是旧 tab 快照 / 轮询未补齐）保留待恢复状态，
  // 让 fetch/poll 返回后的补插能真正执行——否则视口图会卡在占位等用户滚动触发。
  const hasConnected = mmdState.some(x => x.div && x.div.isConnected);
  const allReady = mmdState.every(x => !x.div || !x.div.isConnected || x.res != null);
  if (inserted === 0 && hasConnected && allReady && settled) {
    _pendingRestore = null;
  }
}

/* fetch/poll 返回后无条件校正：恢复滚动位置 + 补插视口图。
   applyPendingRestore 依赖 _pendingRestore，可能因旧快照提前收敛而清空；
   这里不依赖它——只要 mmdState 已更新为本 tab 快照，就强制恢复滚动并补插视口图，
   保证切走再切回（冷缓存/慢后端）时视口内的图一定会被插入，不卡占位。 */
function forceRestoreAndFlush() {
  const act = curActiveTab();
  if (!act || act.kind !== "md") return;
  const c = $("#content");
  if (!c) return;
  // 仅在用户尚未主动滚离目标位置（±150px，即懒加载 buffer）时恢复滚动，
  // 避免慢后端轮询数秒后把用户已滚动到的位置强行拉回
  if (Math.abs(c.scrollTop - (act.scrollTop || 0)) <= 150) {
    c.scrollTop = act.scrollTop || 0;
  }
  flushMermaidInView();
}

function isCodeFile(path) {
  return /\.(java|xml|py|js|ts|jsx|tsx|sql|yml|yaml|json|properties|sh|bat|cmd|gradle|css|kt|go|c|cpp|h|vue|ini|cfg|txt)$/i.test(path);
}

/* 图片文件（打开为图片预览 tab） */
function isImageFile(path) {
  return /\.(png|jpe?g|gif|svg|webp|bmp|ico|avif)$/i.test(path);
}

/* HTML 文件（打开为 html tab：默认渲染视图，可切源码） */
function isHtmlFile(path) {
  return /\.html?$/i.test(path);
}

/* tab 类型分类：image / html / code / md */
function tabKindForPath(path) {
  if (isImageFile(path)) return "image";
  if (isHtmlFile(path)) return "html";
  return isCodeFile(path) ? "code" : "md";
}

/* 链接路径解析：
   - 以 / 开头 → 从项目根目录开始的绝对路径（常见写法：/docs/00.md、/gits/xx.java）
   - 否则 → 相对 mdPath 所在目录的相对路径 */
function resolveRel(mdPath, rel) {
  let base;
  let parts;
  if (rel.startsWith("/")) {
    // 根绝对链接：归属当前文档所在工作区根（多根时 mdPath 首段是 vtop 前缀）
    const first = mdPath.split("/")[0];
    base = _vtops.includes(first) ? [first] : [];
    parts = rel.split("/");
  } else {
    base = mdPath.split("/").slice(0, -1);
    parts = rel.split("/");
  }
  for (const p of parts) {
    if (p === "." || p === "") continue;
    if (p === "..") { if (base.length) base.pop(); }
    else base.push(p);
  }
  return base.join("/");
}

/* ================= 代码弹窗 ================= */
let modalState = { path: null, line: null, content: "", git: null, commit: null, branchContent: null, _branchSeq: 0 };

async function openCodeModal(path, line) {
  try {
    const j = await api("/api/code?path=" + encodeURIComponent(path));
    modalState = { path, line, content: j.content, git: null, branchContent: null, commit: null, commitContent: null, _branchSeq: 0, _backStack: [], _viewBranch: null, lines: j.lines, size: j.size, _defbar: null };
    $("#m-path").textContent = j.path;
    $("#m-path").dataset.full = j.path;   // 面包屑点击定位树用
    $("#m-path").title = j.path;   // hover 显示完整路径
    $("#m-size").textContent = j.lines + " 行 · " + fmtSize(j.size);
    $("#m-line-badge").textContent = line ? "跳转行 " + line : "";
    $("#m-textarea").value = j.content;
    renderCodeView(j.content, line);
    $("#modal-mask").classList.add("show");
    $("#m-back").style.display = "none";
    setModalDefbar(null);
    if (line) requestAnimationFrame(() => scrollCodeToLine(line));
    loadGitMeta(path);
  } catch (e) {
    toast("打开代码失败: " + e.message, "err");
  }
}

/* 加载文件所属仓库的分支 + 最近提交，填充下拉 */
async function loadGitMeta(path, { skipAuto = false } = {}) {
  const bar = $("#m-gitbar");
  const seq = modalState._branchSeq || 0;
  try {
    const j = await api("/api/git/meta?path=" + encodeURIComponent(path));
    if (modalState.path !== path || (modalState._branchSeq || 0) !== seq) return;   // 已跳走/已切换，丢弃过期响应
    if (j.repo === null || !j.branches.length) {
      bar.style.display = "none";
      return;
    }
    modalState.git = { branches: j.branches, current: j.current, commits: j.commits, repo: j.repo };
    bar.style.display = "";
    // 默认选中分支 = 记忆分支（存在时），否则本地分支；记忆分支 ≠ 本地分支时打开即加载其内容
    const def = getDefaultBranch(j.repo);
    const eff = (def && j.branches.includes(def)) ? def : j.current;
    $("#m-branch").innerHTML = j.branches
      .map(b => `<option value="${escapeHtml(b)}"${b === eff ? " selected" : ""}>${escapeHtml(b)}</option>`)
      .join("");
    fillCommitSelect(j.commits, eff, j.repo);
    if (eff !== j.current && !skipAuto) {
      // 异步加载记忆分支内容（下拉已填充 eff，onBranchChange 直接读 value）。
      // 仅全新打开时自动应用；跳转/返回走 restoreModalSelects，不自动触发（避免覆盖跳转带入分支/提交）。
      setTimeout(() => {
        if (modalState.path !== path || (modalState._branchSeq || 0) !== seq) return;
        onBranchChange();
      }, 0);
    }
  } catch (e) {
    bar.style.display = "none";
  }
}

/* 填充提交下拉：分支名作为首项（= 该分支最新），之后按时间倒序 */
function fillCommitSelect(commits, branch, repo) {
  const sel = $("#m-commit");
  const opts = [];
  if (branch) opts.push(`<option value="${escapeHtml(branch)}">◎ ${escapeHtml(branch)} 最新</option>`);
  commits.forEach(c => {
    opts.push(`<option value="${c.hash}">${c.short} ${escapeHtml(c.author)} ${c.date} ${escapeHtml(c.subject.slice(0, 30))}</option>`);
  });
  sel.innerHTML = opts.join("");
  sel.selectedIndex = 0;
}

/* 分支切换 → 重拉该分支的提交 + 该分支 HEAD 下当前文件的真实内容 */
async function onBranchChange() {
  const branch = $("#m-branch").value;
  if (modalState.git && modalState.git.repo) setDefaultBranch(modalState.git.repo, branch);   // 手动切换/自动应用都记住该分支
  const seq = (modalState._branchSeq || 0) + 1;
  modalState._branchSeq = seq;
  try {
    const j = await api("/api/git/meta?path=" + encodeURIComponent(modalState.path) + "&branch=" + encodeURIComponent(branch));
    if (modalState._branchSeq !== seq) return;   // 已切到别的分支，丢弃过期响应
    modalState.git.commits = j.commits || [];
    fillCommitSelect(j.commits || [], branch, j.repo);
    modalState.commit = null;
    modalState.commitContent = null;
    // 拉该分支 HEAD 的真实文件内容（git show 支持分支名），缓存并切到该分支版本
    const fj = await api("/api/git/file?path=" + encodeURIComponent(modalState.path) + "&commit=" + encodeURIComponent(branch)).catch(() => null);
    if (modalState._branchSeq !== seq) return;
    if (fj) {
      modalState.branchContent = fj.content;
      modalState._viewBranch = branch;
      renderCodeView(fj.content, modalState.line);
      $("#m-gitinfo").style.display = "none";
      toast("已切换到分支 " + branch, "ok");
    } else {
      // 该分支不存在此文件：保持当前视图不破坏，仅提示
      modalState.branchContent = null;
      modalState._viewBranch = branch;
      modalState.commitContent = null;
      $("#m-gitinfo").innerHTML =
        `<span class="gi-stat" style="color:var(--fg-dim)">⚠ 分支 ${escapeHtml(branch)} 不存在此文件</span>`;
      $("#m-gitinfo").style.display = "flex";
      toast("分支 " + branch + " 不存在此文件", "err");
    }
  } catch (e) {
    if (modalState._branchSeq !== seq) return;
    toast("切换分支失败: " + e.message, "err");
  }
}

/* 提交选中 → 拉该提交对当前文件的 diff，渲染 diff 视图（红删绿增） */
async function onCommitChange() {
  const sel = $("#m-commit");
  const val = sel.value;
  const branch = $("#m-branch").value;
  if (!val || val === branch) {  // 「分支最新」= 该分支 HEAD 文件（优先用切分支时缓存的内容）
    modalState.commit = null;
    modalState.commitContent = null;
    renderCodeView(modalState.branchContent || modalState.content, modalState.line);
    $("#m-gitinfo").style.display = "none";
    return;
  }
  try {
    // 并行拉：该提交对当前文件的 diff + 该提交版本的完整文件
    const [j, fj] = await Promise.all([
      api("/api/git/diff?path=" + encodeURIComponent(modalState.path) + "&commit=" + encodeURIComponent(val)),
      api("/api/git/file?path=" + encodeURIComponent(modalState.path) + "&commit=" + encodeURIComponent(val)).catch(() => null),
    ]);
    const m = j.meta;
    modalState.commit = val;
    modalState.commitContent = null;
    if (!j.hunks || !j.hunks.length) {
      // 该提交未改此文件：保持当前视图，只提示
      $("#m-gitinfo").innerHTML =
        `<span class="gi-hash">${m.short}</span><span class="gi-author">${escapeHtml(m.author)}</span>` +
        `<span class="gi-date">${m.date}</span><span class="gi-subject">${escapeHtml(m.subject)}</span>` +
        `<span class="gi-stat" style="color:var(--fg-dim)">⚠ 此提交未修改该文件</span>`;
      $("#m-gitinfo").style.display = "flex";
      renderCodeView(modalState.branchContent || modalState.content, modalState.line);
      return;
    }
    let added = 0, removed = 0;
    j.hunks.forEach(h => h.lines.forEach(l => { if (l.type === "+") added++; else if (l.type === "-") removed++; }));
    modalState.commitContent = fj ? fj.content : null;
    $("#m-gitinfo").innerHTML =
      `<span class="gi-hash">${m.short}</span><span class="gi-author">${escapeHtml(m.author)}</span>` +
      `<span class="gi-date">${m.date}</span><span class="gi-subject">${escapeHtml(m.subject)}</span>` +
      `<span class="gi-stat">+${added} −${removed} 行</span>`;
    $("#m-gitinfo").style.display = "flex";
    // 完整文件 + 改动标记视图
    const fileLines = fj ? fj.content.split("\n") : [];
    renderFileWithDiff(fileLines, j.hunks, j.meta);
  } catch (e) {
    toast("加载提交改动失败: " + e.message, "err");
  }
}

/* ================= 虚拟滚动（大文件渲染） ================= */
const V_THRESHOLD = 800;   // 超过此行数启用虚拟滚动
const V_LINE_H = 20;       // 行高（与 #m-scroll.vscroll .cl-line 的 CSS 对齐）
const V_BUFFER = 40;       // 可视区上下各多渲染的行数

/* rows: [{no, kind: plain|add|del|ctx|hunk, text}]；hlByLine: 每行高亮 HTML 数组（可空）
   container: 滚动容器（缺省 #m-scroll 弹窗；代码标签页传 .ct-scroll） */
function renderRows(rows, hlByLine, hlLine, container) {
  const scroll = container || $("#m-scroll");
  scroll.classList.remove("vscroll");
  // 清空全部旧内容（普通行 + 旧 v-wrap），避免小文件→大文件切换时残留行
  // 在 vscroll 模式下被 absolute 化且无 top → 全部叠在顶部、跑出 wrap
  scroll.innerHTML = "";
  if (scroll.__vstate) { scroll.__vstate = null; }
  const total = rows.length;
  if (total > V_THRESHOLD) {
    // 虚拟滚动：全量高亮（内存保留），DOM 只渲染可视窗口 ± buffer
    scroll.classList.add("vscroll");
    const w = document.createElement("div");
    w.className = "v-wrap";
    w.style.height = (total * V_LINE_H + 12) + "px";
    scroll.appendChild(w);
    scroll.__vstate = { rows, hl: hlByLine, total, hlLine: hlLine || null, raf: 0 };
    if (!scroll._vScrollFn) {
      scroll._vScrollFn = () => {
        const vs = scroll.__vstate;
        if (vs && !vs.raf) {
          vs.raf = requestAnimationFrame(() => {
            vs.raf = 0;
            // 现查 wrap：避免闭包捕获旧 wrap（文件切换后旧节点已移除）
            const cur = scroll.querySelector(".v-wrap");
            if (cur) paintVirtualWindow(scroll, cur);
          });
        }
      };
      scroll.addEventListener("scroll", scroll._vScrollFn, { passive: true });
    }
    paintVirtualWindow(scroll, w);
    return;
  }
  // 小文件：一次性渲染全部行
  let html = "";
  const bmSet = bmSetFor(scroll);
  const fd = foldSetFor(scroll);   // 折叠区间 {start: end}
  const fStart = fd ? Object.keys(fd).map(Number).sort((a, b) => a - b) : [];
  rows.forEach((r, i) => {
    const cls = ["cl-line"];
    if (r.kind === "add") cls.push("g-add");
    else if (r.kind === "del") cls.push("g-del");
    else if (r.kind === "ctx") cls.push("g-ctx");
    else if (r.kind === "hunk") cls.push("g-hunk");
    if (hlLine && r.no === hlLine) cls.push("hl-line");
    if (bmSet && bmSet.includes(r.no)) cls.push("bm");   // 书签行
    let foldBadge = "";
    if (fStart.length) {
      for (const s of fStart) {
        const e = fd[s];
        if (r.no > s && r.no <= e) { cls.push("fold-hidden"); break; }
        if (r.no === s) { cls.push("folded"); foldBadge = `<span class="fold-badge" title="点击展开 (Ctrl+Shift+])">▸ ${e - s} 行</span>`; break; }
      }
    }
    const no = r.no != null ? r.no : "";
    const sign = r.kind === "add" ? "+" : r.kind === "del" ? "−" : " ";
    const codeHtml = hlByLine ? (hlByLine[i] || escapeHtml(r.text)) : escapeHtml(r.text);
    html += `<div class="${cls.join(" ")}" data-line="${no}"><span class="cl-no">${no}</span><span class="cl-code">${foldBadge}${sign} ${codeHtml}</span></div>`;
  });
  scroll.innerHTML = html;
}

/* 渲染可视窗口：scrollTop → 首尾行号 → 只重建窗口内行（绝对定位） */
function paintVirtualWindow(scroll, wrap) {
  const vs = scroll.__vstate;
  if (!vs) return;
  const st = scroll.scrollTop;
  const ch = scroll.clientHeight;
  const first = Math.max(0, Math.floor(st / V_LINE_H) - V_BUFFER);
  const last = Math.min(vs.total, Math.ceil((st + ch) / V_LINE_H) + V_BUFFER);
  let html = "";
  const bmSet = bmSetFor(scroll);
  for (let i = first; i < last; i++) {
    const r = vs.rows[i];
    const cls = ["cl-line"];
    if (r.kind === "add") cls.push("g-add");
    else if (r.kind === "del") cls.push("g-del");
    else if (r.kind === "ctx") cls.push("g-ctx");
    else if (r.kind === "hunk") cls.push("g-hunk");
    if (vs.hlLine && r.no === vs.hlLine) cls.push("hl-line");
    if (bmSet && bmSet.includes(r.no)) cls.push("bm");   // 书签行
    const no = r.no != null ? r.no : "";
    const sign = r.kind === "add" ? "+" : r.kind === "del" ? "−" : " ";
    const codeHtml = vs.hl ? (vs.hl[i] || escapeHtml(r.text)) : escapeHtml(r.text);
    html += `<div class="${cls.join(" ")}" data-line="${no}" style="top:${6 + i * V_LINE_H}px"><span class="cl-no">${no}</span><span class="cl-code">${sign} ${codeHtml}</span></div>`;
  }
  wrap.innerHTML = html;
}

/* 完整文件 + 改动标记视图：
   以该提交版本的完整文件为底（含行号 + 语法高亮），叠加本次提交的改动——
   新增行绿底、删除行红底删除线（内联在原位置）、改动块上下文灰底。 */
function renderFileWithDiff(fileLines, hunks, meta, container, path) {
  const scroll = container || $("#m-scroll");
  // 构建行序列：{no, kind: plain|add|del|ctx, text}（no=行号；del 行显示旧行号）
  const rows = [];
  let fileIdx = 0;   // 0-indexed 指向 fileLines 当前未处理位置
  const pushRow = (no, kind, text) => rows.push({ no, kind, text });
  hunks.forEach(h => {
    // 改动块之前的未改动区域（plain）
    while (fileIdx < h.new_start - 1) {
      pushRow(fileIdx + 1, "plain", fileLines[fileIdx] || "");
      fileIdx++;
    }
    // 改动块内部
    h.lines.forEach(l => {
      if (l.type === "-") pushRow(l.old_no, "del", l.text);       // 删除行（旧行号，内联插入）
      else if (l.type === "+") { pushRow(l.new_no, "add", l.text); fileIdx++; }
      else { pushRow(l.new_no, "ctx", l.text); fileIdx++; }        // 上下文
    });
  });
  // 尾部未改动区域
  while (fileIdx < fileLines.length) {
    pushRow(fileIdx + 1, "plain", fileLines[fileIdx]);
    fileIdx++;
  }
  // 整段语法高亮 → 按行切分（跨行 token 不切坏）
  const lang = langForPath(path || modalState.path);
  let hl = [];
  try {
    hl = highlightByLine(rows.map(r => r.text).join("\n"), lang);
  } catch (e) {
    hl = rows.map(r => escapeHtml(r.text));
  }
  renderRows(rows, hl, null, scroll);
}

/* 文件视图：整文件行号 + 语法高亮（默认 / 未选提交时） */
function renderCodeView(content, line) {
  // 仅 Java 视图挂 .jump-hover：可 Ctrl+点击跳转的 token 才显示 hover 提示
  $("#m-scroll").classList.toggle("jump-hover", isJavaPath(modalState.path));
  const lang = langForPath(modalState.path);
  let rowHtml = [];
  try {
    rowHtml = highlightByLine(content, lang);
  } catch (e) {
    rowHtml = content.split("\n").map(l => escapeHtml(l).replace(/\t/g, "    "));
  }
  const rows = rowHtml.map((tokensHtml, i) => ({ no: i + 1, kind: "plain", text: "" }));
  // 保留每行高亮 HTML：渲染时直接使用（text 字段不再需要）
  const hlByLine = rowHtml;
  renderRows(rows, hlByLine, line || null);
}

/* 弹窗可见后把目标行滚动到可视区中央 */
function scrollCodeToLine(line, container) {
  const scroll = container || $("#m-scroll");
  if (scroll.classList.contains("vscroll") && scroll.__vstate) {
    scroll.scrollTop = Math.max(0, (line - 1) * V_LINE_H - scroll.clientHeight / 2 + V_LINE_H / 2);
    scroll.__vstate.hlLine = line;
    const wrap = scroll.querySelector(".v-wrap");
    if (wrap) paintVirtualWindow(scroll, wrap);
    return;
  }
  const target = scroll.querySelector(`.cl-line[data-line="${line}"]`);
  if (!target) return;
  const top = target.offsetTop - scroll.clientHeight / 2 + target.offsetHeight / 2;
  scroll.scrollTop = Math.max(0, top);
}

/* 跳转落地目标行一次性 flash：等虚拟滚动重绘稳定后，在行位置放 fixed overlay
   （600ms 后自动移除）。行未渲染时重试，最多 ~1.4s。 */
function flashRowOnce(container, line) {
  let tries = 0;
  const tryFlash = () => {
    const el = container.querySelector(`.cl-line[data-line="${line}"]`);
    if (el && el.getBoundingClientRect().height > 0) {
      const r = el.getBoundingClientRect();
      const ov = document.createElement("div");
      ov.className = "jump-flash-ov";
      ov.style.left = r.left + "px";
      ov.style.top = r.top + "px";
      ov.style.width = r.width + "px";
      ov.style.height = r.height + "px";
      document.body.appendChild(ov);
      setTimeout(() => ov.remove(), 650);
      return;
    }
    if (++tries < 10) setTimeout(tryFlash, 120);
  };
  setTimeout(tryFlash, 180);
}

/* 按扩展名推断 highlight.js 语言 */
function langForPath(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  const map = {
    java: "java", xml: "xml", py: "python", js: "javascript", mjs: "javascript",
    ts: "typescript", jsx: "javascript", tsx: "typescript", sql: "sql",
    yml: "yaml", yaml: "yaml", json: "json", sh: "bash", bat: "bash", cmd: "bash",
    kt: "kotlin", kts: "kotlin", go: "go", c: "c", h: "c", cpp: "cpp", cs: "csharp",
    css: "css", html: "xml", htm: "xml", vue: "xml", svelte: "xml", astro: "xml",
    ini: "ini", cfg: "ini", toml: "toml", diff: "diff", patch: "diff",
    properties: "properties", md: "markdown", markdown: "markdown", gradle: "gradle",
    // 前端常用
    cjs: "javascript", mts: "typescript", cts: "typescript",
    less: "css", scss: "css", sass: "css", styl: "css",
    hbs: "xml", handlebars: "xml", pug: "xml", ejs: "xml", twig: "xml",
    rb: "ruby", php: "php", swift: "swift", rs: "rust", scala: "scala",
    pl: "perl", lua: "lua", dart: "dart", groovy: "groovy", dockerfile: "dockerfile",
    makefile: "makefile", mk: "makefile", graphql: "graphql", proto: "protobuf",
    ps1: "powershell", vb: "vbnet", man: "text",
  };
  return map[ext] || "plaintext";
}

/* Java/Kotlin 后处理（VSCode Dark+ 观感）：hljs 不标方法调用名与变量/字段引用。
   只处理「未被任何 span 包裹」的纯文本标识符（绝无双重包裹）：
   · xxx.yyy( 的 yyy / 独立的 yyy( → hljs-title function_（黄 #DCDCAA）
   · 其余小写开头标识符（变量/字段/参数引用）→ hljs-variable（浅蓝 #9CDCFE）
   显式排除 Java/Kotlin 关键字与字面量、PascalCase 类型/全大写常量；
   字符串/注释/数字已被 hljs 包裹（classes 非空），不会走到这里，本函数也不匹配数字。 */
function hljsPostProcJavaKt(txt) {
  var KW = {};
  ("abstract assert boolean break byte case catch char class const continue default do double " +
   "else enum extends final finally float for goto if implements import instanceof int interface " +
   "long native new package private protected public return short static strictfp super switch " +
   "synchronized this throw throws transient try void volatile while true false null var record " +
   "sealed permits yield module requires exports opens uses provides to transitive " +
   "as break by catch class companion const constructor crossinline data dynamic enum expect " +
   "external final infix init inline inner internal lateinit noinline open operator out override " +
   "private protected public reified sealed suspend tailrec vararg actual abstract annotation " +
   "fun val typeof typealias when where in is object").split(" ").forEach(function (k) { KW[k] = 1; });
  return txt.replace(/\b[A-Za-z_$][\w$]*\b/g, function (m, off, s) {
    if (KW[m] || /^[A-Z]/.test(m)) return m;               // 关键字/字面量、PascalCase 类型/常量 → 不动
    return s.charAt(off + m.length) === "("
      ? '<span class="hljs-title function_">' + m + "</span>"  // 方法调用名 → 黄
      : '<span class="hljs-variable">' + m + "</span>";        // 变量/字段/参数引用 → 浅蓝
  });
}

/* hljs 高亮整个文件后按行重建 DOM，返回每行 HTML（跨行 token 保持正确） */
function highlightByLine(content, lang) {
  let html;
  const hl = hljsLang(lang);   // 归一化：vue→xml、js→javascript、未知→""（不高亮）
  const isJavaKt = lang === "java" || lang === "kotlin" || lang === "kt";
  if (typeof hljs !== "undefined" && hljs.highlight && hl) {
    try {
      html = hljs.highlight(content, { language: hl, ignoreIllegals: true }).value;
    } catch (e) {
      html = escapeHtml(content);
    }
  } else {
    html = escapeHtml(content);
  }
  // hljs 的 Java/Kotlin 语法只对「带赋值的声明」识别类型（hljs-type），静态调用点
  // （JSONObject.parseObject）、无初始化声明、字段/返回类型里的类名都不高亮。
  // 精确增强（只补类型语义位置，统一用 hljs-type 类型色，不碰已高亮的 token，
  // 不误伤字符串/注释/常量）：
  //   · 后跟 . 或 空白 → 类名（静态调用 / 声明 / 返回类型）
  //   · 泛型 <Type>（hljs 会把 < 转义为 &lt;）
  //   排除全大写标识符（常量/枚举），排除已被 span 包裹的内容
  if (isJavaKt) {
    html = html.replace(
      /<span[^>]*>[\s\S]*?<\/span>|\b[A-Z]\w*\b(?=\.)|\b[A-Z]\w*\b(?=\s)|(?<=<|&lt;)\b[A-Z]\w*\b/g,
      (m) => {
        if (m.startsWith("<span")) return m;
        if (!/[a-z]/.test(m)) return m;   // 全大写常量/枚举 → 跳过
        return `<span class="hljs-type">${m}</span>`;
      });
  }
  const tmpl = document.createElement("template");
  tmpl.innerHTML = html;
  const lines = [];
  let current = [];
  lines.push(current);
  function walk(node, classes) {
    if (node.nodeType === 3) {  // text node
      const parts = node.textContent.split("\n");
      for (let i = 0; i < parts.length; i++) {
        if (i > 0) { current = []; lines.push(current); }
        if (parts[i] !== "") {
          // Java/Kotlin：未被任何 span 包裹的纯文本 → 补方法调用名(黄)与变量/字段引用(浅蓝)
          const txt = (!classes.length && isJavaKt) ? hljsPostProcJavaKt(parts[i]) : parts[i];
          current.push({ cls: classes.slice(), txt: txt });
        }
      }
    } else if (node.nodeType === 1 || node.nodeType === 11) {  // element / DocumentFragment
      // 保留 title 的语义子类（class_/function_/inherited__/invoke__），
      // 使函数名(#DCDCAA)与类名(#4EC9B0)在 VSCode Dark+ 配色下可区分
      const cls = (node.className || "").split(" ")
        .filter(c => c.startsWith("hljs-") || c === "class_" || c === "function_" || c === "inherited__" || c === "invoke__");
      const childClasses = classes.concat(cls);
      for (const child of node.childNodes) walk(child, childClasses);
    }
  }
  walk(tmpl.content, []);
  return lines.map(tokens =>
    tokens.map(t => t.cls.length ? `<span class="${t.cls.join(" ")}">${t.txt}</span>` : t.txt).join("")
  );
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

function closeModal() {
  $("#modal-mask").classList.remove("show");
  modalState = { path: null, line: null, content: "", git: null, branchContent: null, commit: null, commitContent: null, _branchSeq: 0, _backStack: [], _viewBranch: null, lines: 0, size: 0, _defbar: null };
  $("#m-back").style.display = "none";
  setModalDefbar(null);
  const scroll = $("#m-scroll");
  if (scroll._vScrollFn) {
    scroll.removeEventListener("scroll", scroll._vScrollFn);
    delete scroll._vScrollFn;
  }
  scroll.__vstate = null;
  scroll.classList.remove("vscroll");
  const wrap = scroll.querySelector(".v-wrap");
  if (wrap) wrap.remove();
}


/* ================= Ctrl+点击 跳转到定义/实现（仅 Java：代码弹窗 / 代码标签页） ================= */
const _escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function isJavaPath(p) { return /\.java$/i.test(p || ""); }

/* 从 ctrl+click 事件里取被点击 token 的信息；非代码 token 返回 null */
/* token 在行内的字符列（0-based）：.cl-code 内容 = sign + 空格 + 高亮 HTML，累计文本长度求得 */
function tokenColInLine(span) {
  const code = span.closest(".cl-code");
  if (!code) return 0;
  let col = 0, found = false;
  const walk = (node) => {
    if (found) return;
    if (node === span) { found = true; return; }
    if (node.nodeType === 3) col += node.textContent.length;
    else if (node.nodeType === 1) {
      if (node.contains(span)) { for (const c of node.childNodes) walk(c); }
      else col += (node.textContent || "").length;
    }
  };
  for (const c of code.childNodes) walk(c);
  return Math.max(0, col - 2);   // 去掉 cl-code 前缀（sign + 空格）
}

/* 点击落在 .cl-code 纯文本（无 span 包裹）里的标识符 → 构造跳转信息。
   仅对 JS/TS/Vue 文件生效；服务端判定失败会明确回报"未找到定义"，不会误跳。
   取词方式：用等宽字体的字符宽度把 clickX 换算成列号，再从行文本切出 [s,e) 区间。 */
function plainTextTokenInfo(e) {
  const path = srcPathFor(e);
  if (!path || !/\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$/i.test(path)) return null;
  const lineDiv = e.target.closest && e.target.closest(".cl-line");
  if (!lineDiv) return null;
  const lineNo = parseInt(lineDiv.dataset.line || "0", 10);
  if (!lineNo) return null;
  const codeEl = e.target.closest(".cl-code");
  if (!codeEl) return null;      // 只处理 cl-code 内部，不抢 cl-no 行号
  const text = codeEl.textContent || "";
  if (!text) return null;

  // 列号换算的基准元素：点在 hljs span 内时用 span 自己的 rect，
  // 否则用 .cl-code 的 rect —— 两者的 left 不同（span 有偏移），
  // 混用会算出越界列号导致取词失败。
  const hitSpan = e.target.closest && e.target.closest(".cl-code span");
  const baseEl = hitSpan && codeEl.contains(hitSpan) ? hitSpan : codeEl;
  const baseText = baseEl.textContent || "";
  const rect = baseEl.getBoundingClientRect();
  if (!rect.width || !baseText) return null;
  const charW = rect.width / baseText.length;
  // baseText 在整行里的起始偏移（点 span 时用；点 cl-code 空白处时为 0）
  const baseOffset = baseEl === codeEl ? 0 : text.indexOf(baseText);
  if (baseOffset < 0) return null;
  const local = Math.floor((e.clientX - rect.left) / Math.max(charW, 0.5));
  const col = baseOffset + local;
  if (col < 0 || col >= text.length) return null;
  if (!/[A-Za-z0-9_$]/.test(text[col])) return null;
  // 取标识符：字母数字下划线 $ 连成词；点 import 路径字符串（'@/components/FooCard.vue'）里的
  // 文件名时也应命中——故对 . 也做一次「把扩展名并入词」的判断。
  let s = col, t = col;
  while (s > 0 && /[A-Za-z0-9_$]/.test(text[s - 1])) s--;
  while (t < text.length && /[A-Za-z0-9_$]/.test(text[t])) t++;
  let name = text.slice(s, t);
  if (!/^[A-Za-z_$][\w$]*$/.test(name)) return null;
  // 跳过 JS/TS 关键字与字面量（服务端也会拒，但前端先滤掉减少无谓请求）
  if (/^(const|let|var|function|return|if|else|for|while|import|from|export|default|class|extends|new|await|async|type|interface|enum|as|of|in|null|undefined|true|false|this|void|delete|typeof|instanceof|switch|case|break|continue|try|catch|finally|throw|yield|super|static|get|set|public|private|protected|readonly|implements|declare|namespace|keyof|infer|never|unknown|any|boolean|string|number|symbol|object|undefined)$/.test(name)) {
    return null;
  }
  if (!lineDiv.classList.contains("jump-flash")) {
    lineDiv.classList.add("jump-flash");
    setTimeout(() => lineDiv.classList.remove("jump-flash"), 600);
  }
  // col 是 .cl-code 内的字符列（服务端按代码文本列解析），不要再叠加行号列宽
  return {
    kind: "variable", name,
    lineNo,
    lineText: lineDiv.textContent || "",
    col: col + 1,   // 1-based（服务端 col1 = col + 1）
    rowDel: false,
    inModal: !!e.target.closest("#m-scroll"),
  };
}

/* 当前点击所在代码视图对应的文件路径（代码弹窗优先，其次当前代码标签页） */
function srcPathFor(e) {
  if (e && e.target && e.target.closest && e.target.closest("#m-scroll")) {
    return (modalState && modalState.path) || "";
  }
  const t = typeof curActiveTab === "function" ? curActiveTab() : null;
  return (t && t.path) || "";
}

function ctrlTokenInfo(e) {
  const span = e.target.closest("#m-scroll span, #ct-scroll span");
  // Vue/HTML 模板里的自定义组件标签（<FooBar/>、<foo-bar>）没有 hljs span 包裹，
  // 直接在文本节点上命中：这类标签同样支持 Ctrl+点击跳到组件定义。
  if (!span) {
    const webTag = webTagInfo(e);
    if (webTag) return webTag;
    return null;
  }
  const cls = span.className || "";
  let kind = null;
  if (cls.includes("function_")) kind = "method";
  else if (cls.includes("hljs-type") || cls.includes("class_")) kind = "type";
  else if (cls.includes("hljs-variable")) kind = "variable";
  // JS/TS/Vue 没有 Java 专属的 hljs _post_proc：hljs 自身的 hljs-keyword/title/
  // attr/property 等 token 同样可作为跳转目标（变量/函数/类型），放宽为 variable 交给
  // 服务端 web_defs 判定；服务端找不到定义会明确回报，不会误跳。
  // 注意排除 hljs-string：import 的模块路径是字符串，其内部的跳转由 plainTextTokenInfo
  // 按列定位处理更准（这里只认整段字符串文本，取词会失准）。
  else if (/\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$/i.test(srcPathFor(e)) &&
           !cls.includes("hljs-string") &&
           /^hljs-(keyword|title|attr|variable|property|function|params|literal|number|regexp|built_in|symbol|selector|prompt|section|meta|subst|doctag|type|class|name)/.test(cls)) {
    kind = "variable";
  }
  if (!kind) {
    // JS/TS/Vue 的 hljs 不一定把每个标识符都包成 span（如 import 子句里的名字、
    // 对象属性、调用点常常是纯文本）。点击落在 .cl-code 纯文本的标识符上时，
    // 用列位置取词构造跳转信息，交给服务端 web_defs 判定。
    return plainTextTokenInfo(e) || null;
  }
  const name = (span.textContent || "").trim();
  if (!/^[A-Za-z_$][\w$]*$/.test(name)) return null;
  // 即时反馈：点击瞬间先给所在行一个短暂高亮（不等 server 返回），提升感知流畅度
  const flashLine = span.closest(".cl-line");
  if (flashLine && !flashLine.classList.contains("jump-flash")) {
    flashLine.classList.add("jump-flash");
    setTimeout(() => flashLine.classList.remove("jump-flash"), 600);
  }
  const lineDiv = span.closest(".cl-line");
  return {
    kind, name,
    lineNo: lineDiv ? parseInt(lineDiv.dataset.line || "0", 10) : 0,
    lineText: lineDiv ? lineDiv.textContent : "",
    col: tokenColInLine(span),
    rowDel: !!span.closest(".cl-line.g-del"),   // diff 视图删除行（旧行号，与文本错位）
    inModal: !!span.closest("#m-scroll"),
  };
}

/* Vue/HTML 模板中的自定义组件标签 → 点击信息。
   命中条件：在 .vue/.html 文件的代码视图里，点在 <FooBar> 的标签名位置上，
   且标签不是内置 HTML 标签（div/span/...）、不是 HTML 原生小写标签。 */
const WEB_BUILTIN_TAGS = new Set([
  "template", "script", "style", "div", "span", "p", "a", "ul", "ol", "li", "table",
  "thead", "tbody", "tr", "td", "th", "form", "input", "button", "select", "option",
  "label", "img", "br", "hr", "h1", "h2", "h3", "h4", "h5", "h6", "header", "footer",
  "nav", "section", "article", "aside", "main", "canvas", "svg", "path", "g", "circle",
  "rect", "line", "polyline", "iframe", "video", "audio", "textarea", "pre", "code",
  "strong", "em", "small", "b", "i", "u",
]);

function webTagInfo(e) {
  const path = srcPathFor(e);
  if (!path || !/\.(vue|html?)$/i.test(path)) return null;
  const inModal = !!(e.target.closest && e.target.closest("#m-scroll"));
  const lineDiv = e.target.closest(".cl-line");
  if (!lineDiv) return null;
  const lineNo = parseInt(lineDiv.dataset.line || "0", 10);
  if (!lineNo) return null;
  const lineText = lineDiv.textContent || "";
  // 在本行找所有 <Tag>，取包含点击横坐标的那个
  // 基准 rect：点在 span 内时用 span 自己的（span.left 与整行不同），偏移量用 indexOf 补回
  const spanEl = e.target.closest && e.target.closest(".cl-code span");
  const codeEl = e.target.closest && e.target.closest(".cl-code");
  const anchor = (spanEl && codeEl && codeEl.contains(spanEl)) ? spanEl : codeEl;
  const rect = anchor.getBoundingClientRect();
  if (!rect.width) return null;
  const anchorText = anchor.textContent || "";
  const charW = rect.width / Math.max(1, anchorText.length);
  const anchorOffset = anchor === codeEl ? 0 : lineText.indexOf(anchorText);
  if (anchorOffset < 0) return null;
  const absCol = anchorOffset + Math.floor((e.clientX - rect.left) / Math.max(charW, 1));
  const tagRx = /<\s*([A-Za-z][\w.-]*)\b/g;
  let m, best = null;
  while ((m = tagRx.exec(lineText))) {
    const tag = m[1];
    const nameStart = m.index + 1;
    const nameEnd = nameStart + tag.length;
    if (absCol >= nameStart && absCol <= nameEnd) { best = tag; break; }
  }
  if (!best) return null;
  const low = best.toLowerCase();
  if (WEB_BUILTIN_TAGS.has(low) && best === low) return null;   // 原生小写标签不跳
  const pascal = best.split(/[-_]/).map(p => p ? p[0].toUpperCase() + p.slice(1) : "").join("");
  const flashLine = lineDiv;
  if (flashLine && !flashLine.classList.contains("jump-flash")) {
    flashLine.classList.add("jump-flash");
    setTimeout(() => flashLine.classList.remove("jump-flash"), 600);
  }
  return {
    kind: "type", name: pascal || best,
    lineNo,
    lineText,
    col: tokenColInLine(anchor),
    rowDel: false,
    inModal,
  };
}

/* 当前显示的代码文本 / git 上下文（弹窗 or 标签页） */
function modalViewText() {
  if (modalState.commit && modalState.commitContent != null) return modalState.commitContent;
  if (modalState.branchContent != null) return modalState.branchContent;
  return modalState.content || "";
}
function modalViewCommit() {
  if (modalState.commit && modalState.commitContent != null) return { commit: modalState.commit, isBranch: false };
  if (modalState.branchContent != null && modalState._viewBranch) return { commit: modalState._viewBranch, isBranch: true };
  return null;
}
function tabViewText(tab) {
  if (tab.commit && tab.diffData) return tab.diffData.fileLines.join("\n");
  if (tab.branchContent != null) return tab.branchContent;
  return tab.content || "";
}
function tabViewCommit(tab) {
  if (tab.commit && tab.diffData) return { commit: tab.commit, isBranch: false };
  if (tab.branchContent != null && tab._viewBranch) return { commit: tab._viewBranch, isBranch: true };
  return null;
}
function jumpSource(inModal) {
  if (inModal) return { text: modalViewText(), view: modalViewCommit(), path: modalState.path, tab: null };
  const tab = curActiveTab();
  if (!tab || tab.kind !== "code") return null;
  return { text: tabViewText(tab), view: tabViewCommit(tab), path: tab.path, tab };
}

/* 注释/字符串/字符字面量置空（保持行数），避免声明匹配误中 */
function stripCodeNoise(text) {
  let inBlock = false;
  return text.split("\n").map(ln => {
    let out = "", i = 0;
    const s = ln;
    while (i < s.length) {
      const ch = s[i], nx = s[i + 1];
      if (inBlock) {
        if (ch === "*" && nx === "/") { inBlock = false; i += 2; continue; }
        out += " "; i++; continue;
      }
      if (ch === "/" && nx === "/") { out += " ".repeat(Math.max(1, s.length - i)); break; }
      if (ch === "/" && nx === "*") { inBlock = true; out += "  "; i += 2; continue; }
      if (ch === '"' || ch === "'") {
        out += " "; i++;
        while (i < s.length) {
          if (s[i] === "\\") { out += "  "; i += 2; continue; }
          if (s[i] === ch) { out += " "; i++; break; }
          out += " "; i++;
        }
        continue;
      }
      out += ch; i++;
    }
    return out;
  }).join("\n");
}

function parsePackage(text) {
  const m = text.match(/^\s*package\s+([\w.]+)\s*;/m);
  return m ? m[1] : null;
}
function parseImports(text) {
  const simple = {}, wild = [];
  const re = /^\s*import\s+(?:static\s+)?([\w.*]+)\s*;/gm;
  let m;
  while ((m = re.exec(text))) {
    const fqn = m[1];
    if (fqn.endsWith(".*")) wild.push(fqn.slice(0, -2));
    else {
      const n = fqn.split(".").pop();
      if (n && !simple[n]) simple[n] = fqn;
    }
  }
  return { simple, wild };
}
function sourceRootOf(path) {
  const m = path.match(/^(.*\/src\/(?:main|test)\/java\/)/);
  return m ? m[1] : null;
}
function fqnToPath(fqn) { return fqn.replace(/\./g, "/") + ".java"; }

/* 在本文件文本里找方法定义行（声明处：修饰符 / 返回类型 + name(），排除调用点 */
function findMethodDef(text, name) {
  const clean = stripCodeNoise(text);
  const lines = clean.split("\n");
  const callLike = new RegExp("(?<![.\\w$])" + _escRe(name) + "\\s*\\(");
  const KW = /\b(public|private|protected|static|final|synchronized|abstract|native|default|strictfp)\b/;
  const RET = /(^|[^A-Za-z0-9_])([A-Z][\w$]*(?:\s*<[^>]*>)?(?:\s*\[\])*|void|var)\s*$/;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    callLike.lastIndex = 0;
    const m = callLike.exec(ln);
    if (!m) continue;
    const before = ln.slice(0, m.index).trim();
    if (KW.test(before) || RET.test(before)) return i + 1;
  }
  return null;
}

/* 找变量/字段/参数/foreach 的声明（返回行号，或 wantType 时返回类型名） */
function findVarDeclLine(text, name, wantType) {
  const clean = stripCodeNoise(text);
  const lines = clean.split("\n");
  const re = new RegExp("\\b([A-Z][\\w$]*(?:\\s*<[^>]*>)?(?:\\s*\\[\\])*|int|long|double|float|boolean|char|byte|short|var)\\s+" + _escRe(name) + "\\s*(?:=|;|,|\\)|:)");
  for (let i = 0; i < lines.length; i++) {
    const m = re.exec(lines[i]);
    if (!m) continue;
    if (!wantType) return i + 1;
    let t = m[1].split("<")[0].trim();
    if (t === "var") {
      const nm = lines[i].match(/new\s+([A-Z][\w$]*)/);
      if (nm) t = nm[1];
    }
    return t;
  }
  return null;
}

/* 点击行里取出 receiver：X.method( 的 X（链式取最后一个） */
function extractReceiver(lineText, name) {
  if (!lineText) return null;
  const re = new RegExp("([A-Za-z_$][\\w$]*)\\s*\\.\\s*" + _escRe(name) + "\\s*\\(", "g");
  let m, last = null;
  while ((m = re.exec(lineText))) last = m[1];
  return last;
}

/* 类型名 → 类文件路径：显式 import / 同包 / 通配符 import / basename 全库搜索 */
async function resolveTypeFile(typeName, srcPath, srcText) {
  if (!typeName) return null;
  const imp = parseImports(srcText);
  const pkg = parsePackage(srcText);
  const root = sourceRootOf(srcPath);
  const cands = [];
  const push = (p) => { if (p && !cands.includes(p)) cands.push(p); };
  if (imp.simple[typeName]) {
    const fp = fqnToPath(imp.simple[typeName]);
    if (root) push(root + fp);   // 同仓库 src 根 + FQN：显式 import 的权威定位（多仓库同名类时优先）
    push(fp);
  }
  else if (typeName.includes(".")) push(fqnToPath(typeName));
  if (root) {
    if (pkg) push(root + pkg.replace(/\./g, "/") + "/" + typeName + ".java");
    for (const w of imp.wild) push(root + w.replace(/\./g, "/") + "/" + typeName + ".java");
  }
  push(typeName + ".java");
  let exists = {};
  try {
    const r = await fetch("/api/exists?" + cands.map(p => "path=" + encodeURIComponent(p)).join("&"));
    exists = (await r.json()).exists || {};
  } catch (e) { return null; }
  for (const c of cands) if (exists[c] && exists[c].exists) return exists[c].abs;
  return null;
}

function findTypeDeclLine(text, typeName) {
  const re = new RegExp("\\b(class|interface|enum|record)\\s+" + _escRe(typeName) + "\\b");
  const idx = text.split("\n").findIndex(l => re.test(l));
  return idx >= 0 ? idx + 1 : null;
}
function isInterfaceFile(text, typeName) {
  return new RegExp("\\binterface\\s+" + _escRe(typeName) + "\\b").test(text);
}

/* 类型来自外部/框架包（fastjson、MyBatis-Plus、org.*、java.*、其他服务等） */
function isExternalFqn(text, typeName) {
  const imp = parseImports(text);
  const fqn = imp.simple[typeName];
  const pkg = fqn || typeName;
  const ownRoot = (parsePackage(text) || "").split(".").slice(0, 2).join(".");
  const EXT = ["java.", "javax.", "jdk.", "sun.", "com.baomidou", "com.alibaba", "org.", "com.github",
    "lombok", "io.", "cn.", "com.fasterxml", "org.mybatis", "com.pvh.utils", "com.pvh.db"];
  if (EXT.some(p => pkg.startsWith(p))) return true;
  if (imp.simple[typeName] && ownRoot && !pkg.startsWith(ownRoot)) return true;
  return false;
}

/* 目标类文件继承/实现了框架类型（IService/ServiceImpl/BaseMapper…）→ 方法不在本地定义 */
function isFrameworkParent(text) {
  if (/\bextends\s+IService\b|\bextends\s+ServiceImpl\b|\bextends\s+BaseMapper\b|\bextends\s+Mapper\b/.test(text)) return true;
  const imp = parseImports(text);
  const names = [];
  const re = /(?:extends|implements)\s+([A-Z][\w$]*)/g;
  let m;
  while ((m = re.exec(stripCodeNoise(text)))) names.push(m[1]);
  const EXT = ["com.baomidou", "com.alibaba", "org.springframework", "org.apache", "java.", "javax.",
    "com.github", "org.slf4j", "lombok", "io.", "cn.", "org.jeasy", "com.fasterxml", "com.pvh.utils", "com.pvh.db"];
  return names.some(n => { const f = imp.simple[n]; return f && EXT.some(p => f.startsWith(p)); });
}

/* 拉取目标文件：工作区内容 + （有 git 上下文时）分支/提交版本。
   分支/提交视图下目标文件可能只在 git 侧存在（工作区已删/改名）→ /api/code 404 时用 git 版本兜底。 */
async function fetchJumpFiles(path, view) {
  let codeJ = null;
  try { codeJ = await api("/api/code?path=" + encodeURIComponent(path)); }
  catch (e) { codeJ = null; }
  let viewText = null, meta = null;
  if (view && view.commit) {
    const fj = await api("/api/git/file?path=" + encodeURIComponent(path) + "&commit=" + encodeURIComponent(view.commit)).catch(() => null);
    if (!fj) return null;   // 该分支/提交无此文件
    viewText = fj.content; meta = fj.meta || null;
    if (!codeJ) return { content: viewText, viewText, meta, lines: fj.lines, size: (viewText || "").length };
  }
  if (!codeJ) return null;
  return { content: codeJ.content, viewText, meta, lines: codeJ.lines, size: codeJ.size };
}

/* 接口 → 实现类入口：{path, files, line} */
async function resolveImplEntry(src, typeName, name, forMethod) {
  const ip = await resolveTypeFile(typeName + "Impl", src.path, src.text);
  if (!ip) return null;
  const ifiles = await fetchJumpFiles(ip, src.view).catch(() => null);
  if (!ifiles) return null;
  const itext = ifiles.viewText || ifiles.content;
  const il = forMethod ? findMethodDef(itext, name) : findTypeDeclLine(itext, typeName + "Impl");
  if (il == null) return null;
  return { path: ip, files: ifiles, line: il };
}

function toastJump(msg) { toast(msg, "err"); }

/* ---------- 弹窗侧：跳转 / 返回栈 / 实现类入口 ---------- */
/* 弹窗当前视口中心行号（返回时恢复的目标行）：
   用 elementFromPoint 取视口中心点命中的 .cl-line 行号——对虚拟滚动（20px/行）
   与小文件（真实行高）同样精确，无需行高假设。命中不到行（空白/异常）返回 null。 */
function modalViewportLine() {
  const scroll = $("#m-scroll");
  if (!scroll) return null;
  const r = scroll.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return null;
  const el = document.elementFromPoint(Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2));
  const line = el && el.closest ? el.closest(".cl-line") : null;
  if (!line) return null;
  const no = parseInt(line.dataset.line, 10);
  return Number.isFinite(no) && no > 0 ? no : null;
}

function snapshotOfModal() {
  const s = modalState;
  return {
    path: s.path, line: s.line, content: s.content, git: s.git,
    branchContent: s.branchContent, commit: s.commit, commitContent: s.commitContent,
    _viewBranch: s._viewBranch, lines: s.lines, size: s.size, _defbar: s._defbar || null,
    viewportLine: modalViewportLine(),   // 当前视口中心行（而非打开时跳转行），返回时恢复
  };
}

function renderModalView() {
  const st = modalState;
  $("#m-path").textContent = st.path || "";
  if (st.path) $("#m-path").dataset.full = st.path;   // 面包屑点击定位树用
  $("#m-path").title = st.path || "";   // hover 显示完整路径
  $("#m-size").textContent = (st.lines || 0) + " 行 · " + fmtSize(st.size || 0);
  $("#m-line-badge").textContent = st.line ? "跳转行 " + st.line : "";
  const text = modalViewText();
  $("#m-textarea").value = text;
  renderCodeView(text, st.line);
  if (st.line) requestAnimationFrame(() => scrollCodeToLine(st.line));
  if (st.line) flashRowOnce($("#m-scroll"), st.line);   // 弹窗内跳转落地 flash
}

function restoreModalSelects(st) {
  const b = $("#m-branch");
  if (b && st._viewBranch) {
    const hit = Array.from(b.options).some(o => o.value === st._viewBranch);
    if (hit) b.value = st._viewBranch;
  }
  const c = $("#m-commit");
  if (c && st.commit) {
    const idx = Array.from(c.options).findIndex(o => o.value === st.commit);
    if (idx >= 0) c.selectedIndex = idx;
  }
}

function setModalDefbar(info) {
  const bar = $("#m-defbar");
  modalState._defbar = info || null;
  if (!bar) return;
  if (!info || !info.impl) { bar.style.display = "none"; bar.innerHTML = ""; return; }
  const label = info.impl.path.split("/").pop().replace(/\.java$/, "");
  bar.style.display = "flex";
  bar.innerHTML = `<span class="defbar-lbl">实现:</span> <button type="button">${escapeHtml(label)}</button>`;
  bar.querySelector("button").onclick = () => {
    modalOpenPath(info.impl.path, info.impl.line, info.view || null, null, info.impl.files);
  };
}

async function modalOpenPath(path, line, view, info, prefetched) {
  pushNav(path, line);   // 弹窗内跨文件跳转统一入全局历史（Alt+← 可回）
  const files = prefetched || await fetchJumpFiles(path, view);
  if (!files) { toastJump("未找到定义"); return; }
  modalState._backStack.push(snapshotOfModal());
  const st = {
    path, line,
    content: files.content, git: null,
    branchContent: null, commit: null, commitContent: null,
    _branchSeq: (modalState._branchSeq || 0) + 1,
    _backStack: modalState._backStack,
    _viewBranch: null,
    lines: files.lines, size: files.size,
    _defbar: null,
  };
  if (view && files.viewText != null) {
    if (view.isBranch) { st.branchContent = files.viewText; st._viewBranch = view.commit; }
    else { st.commit = view.commit; st.commitContent = files.viewText; }
  }
  modalState = st;
  $("#m-gitinfo").style.display = "none";
  renderModalView();
  $("#m-back").style.display = modalState._backStack.length ? "" : "none";
  setModalDefbar(info);
  loadGitMeta(path, { skipAuto: true }).then(() => restoreModalSelects(st)).catch(() => {});
}

function modalGoBack() {
  const st = modalState._backStack.pop();
  if (!st) return;
  modalState = {
    path: st.path, line: st.viewportLine != null ? st.viewportLine : st.line, content: st.content, git: st.git,
    branchContent: st.branchContent, commit: st.commit, commitContent: st.commitContent,
    _branchSeq: (modalState._branchSeq || 0) + 1,
    _backStack: modalState._backStack,
    _viewBranch: st._viewBranch, lines: st.lines, size: st.size, _defbar: st._defbar,
  };
  $("#m-gitinfo").style.display = "none";
  renderModalView();
  $("#m-back").style.display = modalState._backStack.length ? "" : "none";
  setModalDefbar(modalState._defbar);
  loadGitMeta(st.path, { skipAuto: true }).then(() => restoreModalSelects(modalState)).catch(() => {});
}

/* 本文件内跳转：弹窗入栈换行 / 标签页同文件滚动 */
function localJump(src, line) {
  if (src.tab) { openTab(src.path, { focus: true, line }); return; }
  modalState._backStack.push(snapshotOfModal());
  modalState.line = line;
  $("#m-gitinfo").style.display = "none";
  renderModalView();
  $("#m-back").style.display = modalState._backStack.length ? "" : "none";
  setModalDefbar(null);
}

/* ---------- 标签页侧：新开代码标签页 + 带入分支/提交 + 实现类入口 ---------- */
function tabDefbarHtml(info) {
  const impl = info && info.impl;
  if (!impl) return "";
  const label = impl.path.split("/").pop().replace(/\.java$/, "");
  return `<span class="defbar-lbl">实现:</span> <button type="button">${escapeHtml(label)}</button>`;
}

function openTargetTab(src, path, line, info) {
  pushNav(path, line);   // 标签页侧跳实现入全局历史
  const view = src.view;
  const tab = openTab(path, {
    focus: true, line,
    branch: view && view.isBranch ? view.commit : null,
    commit: view && !view.isBranch ? view.commit : null,
  });
  if (tab && info && info.impl) {
    tab._jumpDefbar = {
      html: tabDefbarHtml(info),
      label: info.impl.path.split("/").pop().replace(/\.java$/, ""),
      impl: info.impl, view,
    };
  }
  return tab;
}

async function openTarget(src, path, files, line, info) {
  if (src.tab) { openTargetTab(src, path, line, info); return; }
  await modalOpenPath(path, line, src.view, info, files);
}

/* ---------- 主流程（server 端 javalang AST 解析） ---------- */
async function ctrlJump(src, info) {
  const { kind, name, lineNo, col, rowDel } = info;
  // JS/TS/Vue 走前端专用解析器（web_defs）；Java/Kotlin 走 javalang
  const endpoint = isWebPath(src.path) ? "/api/web/def" : "/api/java/def";
  try {
    // diff 视图删除行：data-line 是旧文件行号，与传入文本错位 → 走旧正则兜底
    if (rowDel) return ctrlJumpFallback(src, info);
    let res = null;
    try {
      // 5s 超时：git show 冷缓存可能较慢；仅网络错误/超时才降级兜底，
      // 服务端明确 error（非 2xx）直接 toast 展示，不静默吞掉真实原因。
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 5000);
      let r;
      try {
        r = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: src.path, line: lineNo, col,
            text: src.text,
            branch: src.view && src.view.isBranch ? src.view.commit : null,
            commit: src.view && !src.view.isBranch ? src.view.commit : null,
            name, kind,
          }),
          signal: ctl.signal,
        });
      } finally {
        clearTimeout(timer);
      }
      const payload = await r.json().catch(() => null);
      if (!r.ok) {
        console.warn("jumpToDef server error:", r.status, payload && payload.error);
        return toastJump((payload && payload.error) || ("跳转失败: HTTP " + r.status));
      }
      res = payload;
      if (!res) throw new Error("bad response");
    } catch (e) {
      return ctrlJumpFallback(src, info);   // 网络错误/超时 → 旧正则启发式兜底
    }
    if (res.error) return toastJump(res.error);
    // 跳转来源入栈（返回按钮/Alt+← 可回）：先记点击处，目标由 openTargetTab/modalOpenPath 入栈
    pushNav(src.path, lineNo);
    if (res.file === src.path) return localJump(src, res.line);
    const files = await fetchJumpFiles(res.file, src.view);
    if (!files) return toastJump("未找到定义");
    let impl = null;
    if (res.impl) {
      const ifiles = await fetchJumpFiles(res.impl.file, src.view).catch(() => null);
      if (ifiles) impl = { path: res.impl.file, line: res.impl.line, files: ifiles };
    }
    return openTarget(src, res.file, files, res.line, {
      kind: res.kind || kind, name: res.defName || name, impl, view: src.view,
    });
  } catch (err) {
    console.error("jumpToDef error:", err);
    toastJump("跳转失败: " + err.message);
  }
}

/* ---------- 主流程（旧：前端正则启发式，接口失败 / diff 删除行时兜底） ---------- */
async function ctrlJumpFallback(src, info) {
  const { kind, name, lineText, lineNo } = info;
  try {
    if (kind === "variable") {
      const line = findVarDeclLine(src.text, name, false);
      if (line) {
        pushNav(src.path, lineNo);
        return localJump(src, line);
      }
      return toastJump("未找到定义");
    }
    if (kind === "type") {
      const resolved = await resolveTypeFile(name, src.path, src.text);
      if (!resolved) return toastJump(isExternalFqn(src.text, name) ? "外部/框架方法，无本地定义" : "未找到定义");
      const files = await fetchJumpFiles(resolved, src.view);
      if (!files) return toastJump("未找到定义");
      const text = files.viewText || files.content;
      const declLine = findTypeDeclLine(text, name);
      const isIface = isInterfaceFile(text, name);
      let impl = null;
      if (isIface && declLine != null) impl = await resolveImplEntry(src, name, name, false);
      pushNav(src.path, lineNo);
      return openTarget(src, resolved, files, declLine || 1, { kind: "type", name, isIface, impl, view: src.view });
    }
    // method
    const localLine = findMethodDef(src.text, name);
    if (localLine) {
      pushNav(src.path, lineNo);
      return localJump(src, localLine);
    }
    const recv = extractReceiver(lineText, name);
    let typeName = null;
    if (recv) {
      if (/^[A-Z]/.test(recv)) typeName = recv;                                  // 静态调用 Type.method
      else typeName = findVarDeclLine(src.text, recv, true);                     // 变量 → 其声明类型
    }
    if (!typeName) return toastJump("未找到定义");
    const resolved = await resolveTypeFile(typeName, src.path, src.text);
    if (!resolved) return toastJump(isExternalFqn(src.text, typeName) ? "外部/框架方法，无本地定义" : "未找到定义");
    const files = await fetchJumpFiles(resolved, src.view);
    if (!files) return toastJump("未找到定义");
    const text = files.viewText || files.content;
    const isIface = isInterfaceFile(text, typeName);
    let defLine = findMethodDef(text, name);
    let impl = null;
    if (isIface && defLine != null) impl = await resolveImplEntry(src, typeName, name, true);
    if (defLine == null) {
      if (isFrameworkParent(text) || isExternalFqn(src.text, typeName)) return toastJump("外部/框架方法，无本地定义");
      return toastJump("未找到定义");
    }
    pushNav(src.path, lineNo);
    return openTarget(src, resolved, files, defLine, { kind: "method", name, isIface, impl, view: src.view });
  } catch (err) {
    console.error("jumpToDef error:", err);
    toastJump("跳转失败: " + err.message);
  }
}

/* 事件委托（捕获阶段）：仅 ctrl+click 且命中代码 token 才处理 */
document.addEventListener("click", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const info = ctrlTokenInfo(e);
  if (!info) return;
  if (e.shiftKey) {
    // 查找引用：Ctrl+Shift+点击符号 → 打开全局搜索并搜该符号名
    e.preventDefault();
    e.stopPropagation();
    globalSearchOpen();
    const inp = $("#gs-input");
    inp.value = info.name;
    globalSearchRun();
    return;
  }
  const src = jumpSource(info.inModal);
  // 支持 Java/Kotlin（javalang AST）与 JS/TS/Vue（web_defs 正则解析）两类文件
  if (!src || !(isJavaPath(src.path) || isWebPath(src.path))) return;
  e.preventDefault();
  e.stopPropagation();
  ctrlJump(src, info);
}, true);

/* JS/TS/Vue 文件判定（与 ctrlJump 的接口分流保持一致） */
function isWebPath(path) {
  return /\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$/i.test(path || "");
}

/* ================= 文件树 ================= */


const expanded = new Set([""]);  // 已展开目录（path 相对根）
const TREE_KEY = "mdreader.tree.v1";   // 树展开状态独立存储（与任务状态分开）
let _treeScrollRestore = 0;           // 页面加载时从存储恢复的 #tree scrollTop

/* 展开态按项目分区：目录树顶层就是项目列表，各项目的展开路径互不相同，
   共用一个 key 会让「切到项目 A 再切回聚合」丢掉聚合视图自己的展开态。
   key 形如 mdreader.tree.<vtop>.v1，聚合视图用 mdreader.tree.all.v1。 */
function treeStoreKey() {
  return "mdreader.tree." + (_curProject ? _curProject : "all") + ".v1";
}

function saveExpanded() {
  try {
    const tree = $("#tree");
    localStorage.setItem(treeStoreKey(), JSON.stringify({
      paths: Array.from(expanded),
      scrollTop: tree ? tree.scrollTop : 0,
    }));
  } catch (e) { /* 存储不可用静默 */ }
}

function loadExpanded() {
  expanded.clear();
  try {
    const d = JSON.parse(localStorage.getItem(treeStoreKey()) || "null");
    if (d && Array.isArray(d.paths)) {
      d.paths.forEach(p => expanded.add(p));
      _treeScrollRestore = typeof d.scrollTop === "number" ? d.scrollTop : 0;
    }
  } catch (e) { /* 忽略损坏数据 */ }
  if (!expanded.size) expanded.add("");
}

/* ================= 代码弹窗/标签页「默认打开分支」记忆 ================= */
const DEFAULT_BRANCH_KEY = "mdreader.defaultBranch.v1";   // {repo: branch} 按仓库记忆用户手动切换过的分支

function getDefaultBranch(repo) {
  try {
    const d = JSON.parse(localStorage.getItem(DEFAULT_BRANCH_KEY) || "null");
    if (d && typeof d === "object" && repo && typeof d[repo] === "string" && d[repo]) return d[repo];
  } catch (e) { /* 坏数据返回 null */ }
  return null;
}

function setDefaultBranch(repo, branch) {
  if (!repo || typeof branch !== "string" || !branch) return;
  try {
    let d = {};
    try { d = JSON.parse(localStorage.getItem(DEFAULT_BRANCH_KEY) || "{}") || {}; } catch (e) { d = {}; }
    if (typeof d !== "object") d = {};
    d[repo] = branch;
    localStorage.setItem(DEFAULT_BRANCH_KEY, JSON.stringify(d));
  } catch (e) { /* 存储不可用静默 */ }
}

async function loadTree(dirPath) {
  const j = await api("/api/list?path=" + encodeURIComponent(dirPath || ""));
  return j.entries;
}

/* ================= 文件树「定位」：展开目标文件的全部父目录 ================= */
/* 用途：代码标签页点「定位」后，左侧树自动展开到目标文件并滚动可见。
   步骤：把路径的各级父目录加入 expanded → renderTree 重建 → 命中高亮 + scrollIntoView。
   落盘走 saveExpanded（tree 展开态独立于任务态），刷新后仍是展开的。 */
async function locateInTree(filePath) {
  const p = (filePath || "").replace(/\\/g, "/").replace(/^\/+/, "");
  if (!p) return false;
  const parts = p.split("/").filter(Boolean);
  if (parts.length <= 1) {          // 根目录下的文件：树根本来就展开
    await renderTree();
    return highlightTreeFile(p);
  }
  const dirs = parts.slice(0, -1);   // 逐级累积：gits / gits/employee / ... / 父目录
  let cur = "";
  expanded.add("");                  // 保证根在展开集合内
  for (const seg of dirs) {
    cur = cur ? cur + "/" + seg : seg;
    expanded.add(cur);
  }
  await renderTree();                // 按新的 expanded 集合重建整棵树
  saveExpanded();
  return highlightTreeFile(p);
}

/* 高亮 + 滚动到树中的目标文件节点；找不到（类型不在树里展示/文件已删）返回 false */
function highlightTreeFile(filePath) {
  const tree = $("#tree");
  const node = tree.querySelector(`.tree-item.file[data-path="${CSS.escape(filePath)}"]`);
  if (!node) return false;
  tree.querySelectorAll(".tree-item.located").forEach(n => n.classList.remove("located"));
  node.classList.add("located");
  node.scrollIntoView({ block: "center", behavior: "smooth" });
  setTimeout(() => node.classList.remove("located"), 2400);
  return true;
}

/* 公共「定位」绑定：任意文件类型标签页（code / html / image / md）共用。
   点击 → 左侧目录树展开到该文件的全部父目录并高亮滚动到该文件。 */
function bindLocateButton(btn, filePath) {
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      const hit = await locateInTree(filePath);
      toast(hit ? "已在目录树中定位" : "目录树中未找到该文件");
    } catch (e) {
      toast("定位失败: " + e.message, "err");
    } finally {
      btn.disabled = false;
    }
  };
}

/* 同步「当前打开文件」高亮：活动标签的路径若在树中可见（父目录已展开）则标记，
   否则清除标记。只标记不强制展开（展开由「定位」负责）。在树渲染/展开折叠/标签切换后调用。 */
function syncTreeActiveFile() {
  const t = curActiveTab();
  const path = t ? t.path : null;
  document.querySelectorAll("#tree .tree-item.file.active-file").forEach(n => n.classList.remove("active-file"));
  if (!path) return;
  const node = document.querySelector(`#tree .tree-item.file[data-path="${CSS.escape(path)}"]`);
  if (node) node.classList.add("active-file");
}

/* ================= 目录树宽度：拖拽调整 + 持久化 ================= */
const TREE_WIDTH_KEY = "mdreader.treeWidth.v1";
let treeWidth = 260;   // 默认宽度（px）
function initTreeResizer() {
  // 恢复上次保存的宽度
  try {
    const v = parseInt(localStorage.getItem(TREE_WIDTH_KEY), 10);
    if (v >= 150 && v <= 1600) treeWidth = v;
  } catch (e) { /* 坏数据用默认 */ }
  const tree = $("#tree");
  if (tree) tree.style.setProperty("--tree-w", treeWidth + "px");
  const rz = $("#tree-resizer");
  if (!rz) return;
  rz.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = tree.getBoundingClientRect().width;
    rz.classList.add("dragging");
    document.body.style.userSelect = "none";   // 拖拽中禁止选中文本
    document.body.style.cursor = "col-resize";
    const onMove = (ev) => {
      let w = startW + (ev.clientX - startX);
      w = Math.max(150, Math.min(Math.round(window.innerWidth * 0.85), w));
      tree.style.setProperty("--tree-w", w + "px");
      treeWidth = w;
    };
    const onUp = () => {
      rz.classList.remove("dragging");
      document.body.style.userSelect = "";
      document.body.style.cursor = "";
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      try { localStorage.setItem(TREE_WIDTH_KEY, String(Math.round(treeWidth))); } catch (e2) { /* 存储不可用静默 */ }
    };
    document.addEventListener("mousemove", onMove);
