    document.addEventListener("mouseup", onUp);
  });
}

async function renderTree() {
  const tree = $("#tree");
  const box = $("#tree-items");
  const st = _treeScrollRestore || tree.scrollTop || 0;
  _treeScrollRestore = 0;
  box.innerHTML = "";
  await renderTreeDir(box, "", 0);
  tree.scrollTop = st;          // 刷新/恢复后保持滚动位置
  saveExpanded();               // 同步一次（含 scrollTop）
  syncTreeActiveFile();         // 树重建后重新标记当前打开文件
}

function treeFileIconHtml(ext) {

    `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" ` +
    `stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${cat.inner}</svg></span>`;

async function renderTreeDir(container, dirPath, depth) {
  let entries;
  try {
    entries = await loadTree(dirPath);
  } catch (e) {
    container.innerHTML += `<div class="tree-item" style="color:var(--red)">加载失败: ${escapeHtml(e.message)}</div>`;
    return;
  }
  const dirs = entries.filter(e => e.type === "dir");
  const files = entries.filter(e => e.type === "file");
  for (const d of dirs) {
    const item = document.createElement("div");
    item.className = "tree-item dir";
    item.style.setProperty("--indent", (10 + depth * 14) + "px");
    const open = expanded.has(d.path);
    item.innerHTML = `<span class="t-icon">${open ? "▾" : "▸"}</span><span class="t-label">${escapeHtml(d.name)}</span>`;
    item.addEventListener("click", async () => {
      // 局部增量 toggle：只增删本目录的 tree-sub，绝不重建整棵树（保持 #tree scrollTop）
      const icon = item.querySelector(".t-icon");
      const next = item.nextElementSibling;
      const sub = next && next.classList.contains("tree-sub") ? next : null;
      if (sub) {
        expanded.delete(d.path);
        sub.remove();
        icon.textContent = "▸";
        saveExpanded();
        syncTreeActiveFile();   // 折叠后活动文件可能不再可见 → 清除高亮
      } else {
        expanded.add(d.path);
        const ns = document.createElement("div");
        ns.className = "tree-sub";
        item.after(ns);
        icon.textContent = "▾";
        await renderTreeDir(ns, d.path, depth + 1);
        saveExpanded();
        syncTreeActiveFile();   // 展开后活动文件若在其中 → 标记高亮
      }
    });
    container.appendChild(item);
    if (open) {
      const sub = document.createElement("div");
      sub.className = "tree-sub";
      item.after(sub);
      await renderTreeDir(sub, d.path, depth + 1);
    }
  }
  for (const f of files) {
    // 目录树展示 md / code / html / image 四类可打开文件
    const tkind = tabKindForPath(f.path);
    if (tkind !== "md" && tkind !== "code" && tkind !== "html" && tkind !== "image") continue;
    const item = document.createElement("div");
    item.className = "tree-item file";
    item.dataset.ext = f.ext;
    item.dataset.path = f.path;     // 「定位」按完整相对路径精确匹配（非重名歧义）
    item.style.setProperty("--indent", (10 + depth * 14) + "px");
    item.innerHTML = treeFileIconHtml(f.ext) + `<span class="t-label">${escapeHtml(f.name)}</span>`;
    item.addEventListener("click", () => { pushNav(f.path); openTab(f.path); });
    container.appendChild(item);
  }
}

/* 解析 JSON，出错时定位到 行:列
   优先：错误消息里的 position（Node/Firefox）；其次：轻量扫描器（Chrome 消息无行列） */
function jsonParse(text) {
  try {
    return { ok: true, value: JSON.parse(text) };
  } catch (e) {
    let line = 1, col = 1;
    const m = String(e.message).match(/position (\d+)/);
    if (m) {
      const pos = parseInt(m[1], 10);
      const upTo = text.slice(0, pos);
      const lines = upTo.split("\n");
      line = lines.length;
      col = lines[lines.length - 1].length + 1;
    } else {
      const loc = jsonLocateError(text);
      if (loc) { line = loc.line; col = loc.col; }
    }
    return { ok: false, line, col, message: e.message };
  }
}

/* 轻量 JSON 扫描器：逐字符跟踪字符串/转义/括号栈，返回首个语法错误的位置 */
function jsonLocateError(text) {
  let i = 0, line = 1, col = 1, n = text.length;
  const stack = [];
  const adv = () => { if (text[i] === "\n") { line++; col = 1; } else col++; i++; };
  const err = (msg) => ({ line, col, message: msg });
  const isWs = c => c === " " || c === "\t" || c === "\n" || c === "\r";
  const isDigit = c => c >= "0" && c <= "9";

  while (i < n) {
    const ch = text[i];
    if (isWs(ch)) { adv(); continue; }
    if (ch === '"') {                       // 字符串
      const sLine = line, sCol = col;
      adv(); let closed = false;
      while (i < n) {
        const c = text[i];
        if (c === "\\") { adv(); if (i < n) adv(); continue; }   // 跳过转义
        if (c === '"') { adv(); closed = true; break; }
        if (c === "\n") break;              // 字符串内未转义换行
        adv();
      }
      if (!closed) return { line: sLine, col: sCol, message: "字符串未闭合" };
      continue;
    }
    if (ch === "{" || ch === "[") { stack.push(ch === "{" ? "}" : "]"); adv(); continue; }
    if (ch === "}" || ch === "]") {
      const expect = stack.pop();
      if (expect !== ch) return err(expect ? `意外的 '${ch}'，期望 '${expect}'` : `多余的 '${ch}'`);
      adv(); continue;
    }
    if (ch === ":" ) { adv(); continue; }
    if (ch === ",") {
      adv();
      // 尾随逗号检测：[1,2,] / {"a":1,}
      let j = i; while (j < n && isWs(text[j])) j++;
      if (text[j] === "}" || text[j] === "]") return { line, col, message: "尾随逗号" };
      continue;
    }
    if (isDigit(ch) || ch === "-") { adv(); while (i < n && /[0-9.eE+\-]/.test(text[i])) adv(); continue; }
    if (text.startsWith("true", i) || text.startsWith("false", i) || text.startsWith("null", i)) {
      const kw = text.startsWith("true", i) ? 4 : text.startsWith("false", i) ? 5 : 4;
      for (let k = 0; k < kw; k++) adv();
      continue;
    }
    return err(`意外的字符 '${ch}'`);
  }
  if (stack.length) return { line, col, message: `缺少闭合符 '${stack[stack.length - 1]}'` };
  return null;
}
function jsonRenderOutput(text, isError) {
  const out = $("#json-output");
  if (isError) {
    out.innerHTML = `<span class="j-err">${escapeHtml(text)}</span>`;
    return;
  }
  if (typeof hljs !== "undefined") {
    out.innerHTML = `<code class="hljs">${hljs.highlight(text, { language: "json", ignoreIllegals: true }).value}</code>`;
  } else {
    out.textContent = text;
  }
}
function jsonRun(kind) {
  const text = $("#json-input").value;
  if (!text.trim()) { jsonStatus("输入为空", false); return; }
  const res = jsonParse(text);
  if (!res.ok) {
    jsonRenderOutput(`JSON 解析错误：${res.message}\n位置：第 ${res.line} 行，第 ${res.col} 列`, true);
    jsonStatus(`❌ 解析失败：第 ${res.line} 行，第 ${res.col} 列`, false);
    return;
  }
  const outText = kind === "minify"
    ? JSON.stringify(res.value)
    : JSON.stringify(res.value, null, 2);
  jsonRenderOutput(outText, false);
  jsonStatus(`✅ 解析成功（${kind === "minify" ? "已压缩" : "已格式化"}，${outText.length} 字符）`, true);
}

/* ================= mermaid 全屏查看（缩放/拖动） =================
   方案参照 docs/运维可视化/demo/v4/js/app.js 的 ER 大屏预览：
   - 弹窗内联 SVG（矢量 DOM），不用 img —— 放大永不模糊
   - 缩放 = 改 svg 的 width/height 像素值（SVG 按新尺寸矢量重渲染）
   - 初始 fit 不限制 ≤1（图比视口小则放大到适配，解决"初始倍率太小"）
   - 尺寸基准 = viewBox（mermaid svg 的 viewBox 即设计尺寸） */
const mmdZoom = { scale: 1, tx: 0, ty: 0, dragging: false, lastX: 0, lastY: 0, sw: 0, sh: 0 };

/* 给已渲染的图加右上角全屏按钮（insertSvgAsImg 的 onload 里调用） */
function mmdZoomAddButton(div) {
  if (div.querySelector(".mmd-zoom-btn")) return;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "mmd-zoom-btn";
  btn.title = "全屏查看（滚轮缩放 / 拖动平移）";
  btn.setAttribute("aria-label", "全屏查看 mermaid 图");
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';
  div.appendChild(btn);
}

/* 缩放/平移应用到 SVG 像素尺寸 + pan 容器位移（SVG 矢量重渲染，永不失真） */
function mmdZoomApply() {
  const svg = $("#mmd-zoom-content svg");
  if (svg && mmdZoom.sw) {
    svg.style.maxWidth = "none";   // mermaid 内联 max-width 会卡死真实尺寸，必须清
    svg.style.maxHeight = "none";
    svg.style.width = Math.round(mmdZoom.sw * mmdZoom.scale) + "px";
    svg.style.height = Math.round(mmdZoom.sh * mmdZoom.scale) + "px";
  }
  $("#mmd-zoom-content").style.transform =
    "translate(" + mmdZoom.tx + "px, " + mmdZoom.ty + "px)";
}

/* 初始/重置：图完整放进视口（不限制 ≤1，小图放大到适配） */
function mmdZoomFit() {
  const vp = $("#mmd-zoom-viewport");
  if (!mmdZoom.sw || !mmdZoom.sh) return false;
  mmdZoom.scale = Math.min((vp.clientWidth - 60) / mmdZoom.sw, (vp.clientHeight - 60) / mmdZoom.sh);
  if (!(mmdZoom.scale > 0)) mmdZoom.scale = 1;
  mmdZoom.tx = (vp.clientWidth - mmdZoom.sw * mmdZoom.scale) / 2;
  mmdZoom.ty = (vp.clientHeight - mmdZoom.sh * mmdZoom.scale) / 2;
  mmdZoomApply();
  return true;
}

/* 缩放：保持 (cx,cy) 处的内容点不动（cx/cy 为视口内坐标，缺省 = 视口中心） */
function mmdZoomSetScale(ns, cx, cy) {
  ns = Math.min(5, Math.max(0.2, ns));
  if (!isFinite(cx)) {
    const vp = $("#mmd-zoom-viewport");
    cx = vp.clientWidth / 2; cy = vp.clientHeight / 2;
  }
  const s = mmdZoom.scale;
  mmdZoom.tx = cx - (cx - mmdZoom.tx) * (ns / s);
  mmdZoom.ty = cy - (cy - mmdZoom.ty) * (ns / s);
  mmdZoom.scale = ns;
  mmdZoomApply();
}

function mmdZoomOpen(btn) {
  const div = btn.closest(".mermaid");
  const srcImg = div && div.querySelector("img.mmd-img");
  if (!srcImg || !srcImg.src) return;
  // data URL → SVG 文本（内联进弹窗，矢量渲染，放大不模糊）
  let svgText = null;
  const m = srcImg.src.match(/^data:image\/svg\+xml(?:;charset=utf-8)?,(.*)$/i);
  if (m) { try { svgText = decodeURIComponent(m[1]); } catch (e) {} }
  if (!svgText) return;
  const content = $("#mmd-zoom-content");
  content.innerHTML = svgText;   // 内联 SVG（矢量）
  const svg = content.querySelector("svg");
  if (!svg) return;
  const vb = svg.viewBox && svg.viewBox.baseVal;
  mmdZoom.sw = (vb && vb.width) ? vb.width : (parseFloat(svg.getAttribute("width")) || 800);
  mmdZoom.sh = (vb && vb.height) ? vb.height : (parseFloat(svg.getAttribute("height")) || 600);
  $("#mmd-zoom-mask").classList.add("show");
  mmdZoomFit();   // 打开默认适应窗口
}

function mmdZoomClose() {
  $("#mmd-zoom-mask").classList.remove("show");
  // 恢复 #mmd-zoom-img（open 时 innerHTML 覆盖会移除它，不恢复则下次打开 #mmd-zoom-img 为 null）
  const content = $("#mmd-zoom-content");
  if (!content.querySelector("#mmd-zoom-img")) {
    content.innerHTML = '<img id="mmd-zoom-img" alt="mermaid 图" draggable="false">';
  }
}

$("#mmd-zoom-viewport").addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = e.currentTarget.getBoundingClientRect();
  mmdZoomSetScale(mmdZoom.scale * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

$("#mmd-zoom-viewport").addEventListener("pointerdown", (e) => {
  mmdZoom.dragging = true;
  mmdZoom.lastX = e.clientX; mmdZoom.lastY = e.clientY;
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件/无活动指针 */ }
  e.currentTarget.classList.add("dragging");
  e.preventDefault();
});
$("#mmd-zoom-viewport").addEventListener("pointermove", (e) => {
  if (!mmdZoom.dragging) return;
  mmdZoom.tx += e.clientX - mmdZoom.lastX;
  mmdZoom.ty += e.clientY - mmdZoom.lastY;
  mmdZoom.lastX = e.clientX; mmdZoom.lastY = e.clientY;
  mmdZoomApply();
});
function mmdZoomEndDrag(e) {
  if (!mmdZoom.dragging) return;
  mmdZoom.dragging = false;
  e.currentTarget.classList.remove("dragging");
}
$("#mmd-zoom-viewport").addEventListener("pointerup", mmdZoomEndDrag);
$("#mmd-zoom-viewport").addEventListener("pointercancel", mmdZoomEndDrag);
$("#mmd-zoom-viewport").addEventListener("dblclick", () => mmdZoomFit());

});

/* ================= util ================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ================= 搜索：文件内（Ctrl+F）+ 全局（Ctrl+Shift+F） ================= */
/* 焦点约定：Ctrl+F 拦截浏览器自带查找（preventDefault），焦点进搜索输入框；
   Esc 关闭并清空高亮，焦点回到页面主体。 */
const fsState = { q: "", matches: [], idx: -1, opts: { cs: false, word: false, re: false } };

function fsVisible() { return $("#file-search").style.display !== "none"; }

function fileSearchOpen() {
  $("#file-search").style.display = "flex";
  const inp = $("#fs-input");
  inp.focus();
  inp.select();
  fileSearchClear();   // 只清旧高亮；搜索由回车触发（逐字搜索大文件会卡）
}

function fileSearchClose() {
  fileSearchClear();
  $("#file-search").style.display = "none";
  fsState.q = ""; fsState.matches = []; fsState.idx = -1;
}

/* 清空文件内搜索的所有高亮（代码行 fs-line / md 文本 fs-mark） */
function fileSearchClear() {
  document.querySelectorAll("#ct-scroll .cl-line.fs-line").forEach(n => n.classList.remove("fs-line", "fs-cur"));
  document.querySelectorAll(".md-body mark.fs-mark").forEach(m => {
    const t = document.createTextNode(m.textContent);
    m.replaceWith(t);
  });
  // 关键：mark 换成文本节点后，相邻文本节点不会自动合并；逐字搜索会不断把文本切碎，
  // 导致完整串（如 "ck-dev-1020"）不再落在单个节点里，后续搜索漏匹配。这里强制合并。
  const body = document.querySelector(".md-body");
  if (body) body.normalize();
  const c = $("#fs-count");
  if (c) c.textContent = "";
}

/* 在当前打开文件内搜索；code/html源码按行匹配（整行高亮），md 高亮渲染文本。 */
function fileSearchRun(q) {
  const tab = curActiveTab();
  fileSearchClear();
  fsState.matches = []; fsState.idx = -1;
  fsState.q = q || "";
  if (!fsState.q) return;
  if (!tab) { toast("没有打开的文件", "err"); return; }
  if (tab.kind === "code" || (tab.kind === "html" && tab.htmlMode === "source")) {
    const text = tab.branchContent != null ? tab.branchContent : (tab.content || "");
    fsRunCode(text, fsState.q);
  } else if (tab.kind === "md") {
    fsRunMd(fsState.q);
  } else {
    $("#fs-count").textContent = "该视图不可搜索";
  }
}

function fsRunCode(text, q) {
  const re = fsBuildRe(q);
  if (!re) { toast("正则表达式错误", "err"); return; }
  const lines = text.split("\n");
  const matches = [];
  for (let i = 0; i < lines.length; i++) {
    for (const [s] of fsMatchesIn(lines[i], re)) matches.push({ line: i + 1, col: s + 1 });
  }
  fsState.matches = matches;
  const ct = $("#ct-scroll");
  if (ct) {
    const set = new Set(matches.map(m => m.line));
    ct.querySelectorAll(".cl-line").forEach(row => {
      const no = row.dataset.line;
      if (no && set.has(parseInt(no, 10))) row.classList.add("fs-line");
    });
  }
  $("#fs-count").textContent = matches.length + " 处";
  if (matches.length) fsNav(1, false);
  else toast("无匹配", "err");
}

function fsRunMd(q) {
  const tab = curActiveTab();
  const box = document.querySelector("#content");
  // 竞态保护：打开 md 后立刻搜索时，.md-body 可能还是上一个标签页的内容（fetch/渲染未完成）。
  // marker（dataset.mdPath）设在 #content 上（renderContent 写入）；不一致则等待渲染完成再搜，避免误报「无匹配」。
  if (!tab || !box || box.dataset.mdPath !== tab.path) {
    fsDeferMd(q, 0);
    return;
  }
  const body = box.querySelector(".md-body");
  if (!body) { fsDeferMd(q, 0); return; }
  body.normalize();   // 合并相邻文本节点：防止此前搜索残留的切碎节点导致漏匹配（自愈）
  const re = fsBuildRe(q);
  if (!re) { toast("正则表达式错误", "err"); return; }
  const nodes = [];
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const marks = [];
  for (const node of nodes) {
    const parent = node.parentNode;
    if (parent && parent.classList && parent.classList.contains("fs-mark")) continue;   // 上轮残留
    const text = node.nodeValue;
    const segs = fsMatchesIn(text, re);
    if (!segs.length) continue;
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const [s, e] of segs) {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const mark = document.createElement("mark");
      mark.className = "fs-mark";
      mark.textContent = text.slice(s, e);
      frag.appendChild(mark);
      marks.push(mark);
      pos = e;
    }
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    parent.replaceChild(frag, node);
  }
  fsState.matches = marks.map(m => ({ el: m }));
  $("#fs-count").textContent = marks.length + " 处";
  if (marks.length) fsNav(1, false);
  else toast("无匹配", "err");
}

/* 文件内搜索匹配构造：支持 大小写(cs) / 全字(word) / 正则(re) 三个开关；正则编译失败返回 null */
function fsBuildRe(q) {
  const o = fsState.opts;
  let src = q;
  if (o.re) {
    try { return new RegExp(src, o.cs ? "g" : "gi"); }
    catch (e) { return null; }
  }
  if (o.word) src = "\\b" + escapeRegExp(src) + "\\b";
  else src = escapeRegExp(src);
  try { return new RegExp(src, o.cs ? "g" : "gi"); }
  catch (e) { return null; }
}
function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
/* 在 text 上执行 re，返回所有 [start, end]（每次调用重置 lastIndex，防共享正则残留） */
function fsMatchesIn(text, re) {
  const out = [];
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    out.push([m.index, m.index + m[0].length]);
    if (m[0].length === 0) re.lastIndex++;
  }
  return out;
}

/* md 渲染竞态：等待 #content 变成活动标签的内容后再重新搜索（最多约 1.2s，超时提示） */
function fsDeferMd(q, tries) {
  if (tries > 12) { $("#fs-count").textContent = "内容加载中…"; return; }
  setTimeout(() => {
    const tab = curActiveTab();
    const box = document.querySelector("#content");
    if (!tab) { $("#fs-count").textContent = "没有打开的文件"; return; }
    if (box && box.dataset.mdPath === tab.path) {
      fileSearchRun($("#fs-input").value);   // 用输入框当前值，避免漏掉等待期间新输入的字符
      return;
    }
    fsDeferMd(q, tries + 1);
  }, 100);
}

/* 上/下一个匹配：d=1 下一个，d=-1 上一个；wrap=false 时到底不绕回 */
function fsNav(d, wrap = true) {
  const n = fsState.matches.length;
  if (!n) { toast("无匹配", "err"); return; }
  let next = fsState.idx + d;
  if (next < 0 || next >= n) {
    if (!wrap) { toast("没有更多匹配", "err"); return; }
    next = (next + n) % n;
  }
  fsState.idx = next;
  const m = fsState.matches[next];
  document.querySelectorAll("#ct-scroll .cl-line.fs-cur, .md-body mark.fs-mark.fs-cur")
    .forEach(el => el.classList.remove("fs-cur"));
  if (m.el) {
    m.el.classList.add("fs-cur");
    m.el.scrollIntoView({ block: "center", behavior: "smooth" });
  } else if (m.line) {
    const ct = $("#ct-scroll");
    const row = ct ? ct.querySelector(`.cl-line[data-line="${m.line}"]`) : null;
    if (row) row.classList.add("fs-cur");
    if (ct) scrollCodeToLine(m.line, ct);
  }
  $("#fs-count").textContent = (next + 1) + " / " + n;
}

/* ---------- 全局搜索 ---------- */
/* 搜索历史（localStorage 持久化）+ 正则(r/ 前缀) + 扩展名过滤 */
const GS_HIST_KEY = "mdreader.gsearch.v1";

try { gsHist = JSON.parse(localStorage.getItem(GS_HIST_KEY) || "[]"); } catch (e) { gsHist = []; }
if (!Array.isArray(gsHist)) gsHist = [];
function saveGsHist() { try { localStorage.setItem(GS_HIST_KEY, JSON.stringify(gsHist)); } catch (e) { /* 静默 */ } }
function recordGsHist(word) {

async function globalSearchRun() {

  // r/ 前缀 → 正则模式（忽略大小写）；#gs-ext → 扩展名过滤

/* 片段中高亮命中词（先转义再包 mark；查询词按正则转义，防特殊字符破坏） */
function globalHl(text, q) {
  const esc = escapeHtml(text);
  if (!q) return esc;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  return esc.replace(re, "<mark>$1</mark>");
}

function renderGlobalResults(j, q) {
  const res = $("#gsearch-results");

  if (!results.length) {
    res.innerHTML = `<div class="gs-empty">未找到包含「${escapeHtml(q)}」的文件</div>`;
    $("#gsearch-footer").textContent = "0 个文件";

  const html = results.map(r => {
    totalLines += r.matches.length;
    return `<div class="gs-file">` +
      `<div class="gs-file-head" title="点击展开 / 收起匹配行"><span class="gs-arrow">▶</span>` +
      `<span class="gs-path">${escapeHtml(r.file)}</span>` +
      `<span class="gs-n">${r.matches.length} 行</span></div>` +
      `<div class="gs-lines">` + r.matches.map(m =>
        `<div class="gs-line" data-file="${escapeHtml(r.file)}" data-line="${m.line}" title="打开 ${escapeHtml(r.file)} 第 ${m.line} 行">` +
        `<span class="gs-no">${m.line}</span><span class="gs-txt">${globalHl(m.text, q)}</span></div>`).join("") +
      `</div></div>`;
  }).join("");
  res.innerHTML = html;
  $("#gsearch-footer").innerHTML =
    `${results.length} 个文件 · ${totalLines} 行匹配` +
    (j.truncated ? ` <span style="color:var(--yellow)">（结果过多，已截断）</span>` : "");
  res.querySelectorAll(".gs-file-head").forEach(h => {
    h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
  });
  res.querySelectorAll(".gs-line").forEach(ln => {
    ln.addEventListener("click", () => {
      pushNav(ln.dataset.file, parseInt(ln.dataset.line, 10));
      openTab(ln.dataset.file, { focus: true, line: parseInt(ln.dataset.line, 10) });
    });
  });
}

/* ================= 快速打开（Ctrl+P）/ 最近文件（Ctrl+E）/ 符号大纲（Ctrl+Shift+O） ================= */
/* qoResults 元素统一为对象：{label, sub, target, line} */
let qoFiles = null, qoResults = [], qoIdx = -1, currentQoMode = "open", qoAllOutline = [];
async function loadQuickFiles() {
  if (qoFiles) return qoFiles;
  const j = await api("/api/files").catch(() => ({ files: [] }));
  qoFiles = j.files || [];
  return qoFiles;
}
/* 轻量符号解析（逐行状态机，跳过块注释但保留原行号；不建 AST）：class/interface/enum + 方法签名 → 行号 */
function buildOutline(text) {
  const lines = String(text || "").split("\n");
  const out = [];
  const typeRe = /^\s*(?:(?:public|private|protected|abstract|final|static|strictfp|synchronized)\s+)*(?:class|interface|enum|@interface)\s+([A-Za-z_$][\w$]*)/;
  const methodRe = /^\s*(?:(?:public|private|protected|abstract|final|static|synchronized|native|default)\s+)*[\w<>\[\]?,.\s]+\s+([A-Za-z_$][\w$]*)\s*\([^;{}]*\)/;
  const skipKw = /^\s*(if|for|while|switch|catch|return|throw|new|assert)\b/;
  let curType = null, inBlock = false;
  for (let i = 0; i < lines.length; i++) {
    let raw = lines[i];
    if (inBlock) { if (raw.includes("*/")) inBlock = false; continue; }
    const bs = raw.indexOf("/*");
    if (bs >= 0) {
      if (!raw.includes("*/", bs + 2)) inBlock = true;
      raw = raw.slice(0, bs);   // 行内块注释之前的部分保留
    }
    const code = raw.replace(/\/\/.*$/, "").trim();
    if (!code) continue;
    const tm = code.match(typeRe);
    if (tm) { curType = tm[1]; out.push({ name: tm[1], kind: "类型", line: i + 1 }); continue; }
    const mm = code.match(methodRe);
    if (mm && !skipKw.test(code) && !code.includes("=")) {
      out.push({ name: mm[1] + "()", kind: curType ? curType + " 方法" : "方法", line: i + 1 });
    }
  }
  return out;
}
function quickOpenOpen(mode) {
  currentQoMode = mode === "recent" ? "recent" : mode === "outline" ? "outline" : mode === "bookmark" ? "bookmark" : "open";
  const title = currentQoMode === "recent" ? "最近文件" : currentQoMode === "outline" ? "符号大纲" : currentQoMode === "bookmark" ? "书签" : "快速打开";
  const hint = currentQoMode === "recent"
    ? "Ctrl+E · ↑↓ 选择 · 回车打开 · Esc 关闭"
    : currentQoMode === "outline"
      ? "Ctrl+Shift+O · ↑↓ 选择 · 回车跳转 · Esc 关闭"
      : currentQoMode === "bookmark"
        ? "Ctrl+B · ↑↓ 选择 · 回车跳转 · Esc 关闭（行号区点击可增删书签）"
        : "Ctrl+P · ↑↓ 选择 · 回车打开 · Esc 关闭";
  $("#qo-title").textContent = title;
  $("#qo-hint").textContent = hint;
  $("#quickopen-mask").classList.add("show");
  const inp = $("#qo-input");
  inp.value = ""; qoIdx = -1; qoResults = [];
  $("#quickopen-results").innerHTML = "";
  inp.focus();
  if (currentQoMode === "bookmark") {
    // 书签：所有文件 × 行 → 列表
    const items = [];
    for (const p of Object.keys(bookmarks)) {
      for (const ln of bookmarks[p] || []) {
        items.push({ label: p.split("/").pop() + ":" + ln, sub: p, target: p, line: ln });
      }
    }
    qoAllOutline = items;
    $("#quickopen-footer").textContent = items.length + " 个书签";
    quickFilter("");
  } else if (currentQoMode === "outline") {
    const tab = curActiveTab();
    const out = tab && tab.content != null ? buildOutline(tab.content) : [];
    qoAllOutline = out.map(o => ({ label: o.name, sub: o.kind + " · 第 " + o.line + " 行", target: tab ? tab.path : null, line: o.line }));
    $("#quickopen-footer").textContent = tab ? (tab.path.split("/").pop() + " · " + out.length + " 个符号") : "请先打开代码文件";
    quickFilter("");
  } else if (currentQoMode === "recent") {
    $("#quickopen-footer").textContent = recentFiles.length + " 个最近文件";
    quickFilter("");
  } else {
    $("#quickopen-footer").textContent = "加载文件清单…";
    loadQuickFiles().then(fs => {
      $("#quickopen-footer").textContent = fs.length + " 个文件";
      quickFilter("");
    });
  }
}
function quickOpenClose() { $("#quickopen-mask").classList.remove("show"); }
function quickFilter(q) {
  const ql = q.trim().toLowerCase();
  let base;
  if (currentQoMode === "recent") {
    base = recentFiles.map(p => ({ label: p.split("/").pop(), sub: p.replace(/\/[^/]+$/, ""), target: p, line: null }));
  } else if (currentQoMode === "outline" || currentQoMode === "bookmark") {
    base = qoAllOutline;
  } else {
    base = (qoFiles || []).map(p => ({ label: p.split("/").pop(), sub: p.replace(/\/[^/]+$/, ""), target: p, line: null }));
  }
  let list = base;
  if (ql) {
    list = base.filter(o => (o.label || "").toLowerCase().includes(ql) || (o.sub || "").toLowerCase().includes(ql));
    if (currentQoMode === "open") {
      // 排序：文件名前缀 > 文件名后缀(ServiceImpl 类) > 边界子串 > 任意子串 > 仅路径命中
      const qoScore = (o) => {
        const fn = o.label.toLowerCase();
        if (fn.startsWith(ql)) return 0;
        if (fn.endsWith(ql)) return 1;
        const pos = fn.indexOf(ql);
        if (pos >= 0) {
          const prev = pos > 0 ? fn[pos - 1] : "";
          const next = pos + ql.length < fn.length ? fn[pos + ql.length] : "";
          if ((!prev || /[^a-z0-9]/.test(prev)) || (!next || /[^a-z0-9]/.test(next))) return 2;
          return 3;
        }
        return 4;
      };
      list.sort((a, b) => qoScore(a) - qoScore(b) || a.label.localeCompare(b.label));
    }
    // recent 模式保持最近顺序；outline 保持行号顺序
  }
  qoResults = list.slice(0, 100);
  qoIdx = qoResults.length ? 0 : -1;
  renderQuickResults();
}
function renderQuickResults() {
  const res = $("#quickopen-results");
  res.innerHTML = qoResults.map((o, i) => {
    return `<div class="qo-item${i === qoIdx ? " sel" : ""}" data-i="${i}">` +
      `<span class="qo-name">${escapeHtml(o.label)}</span><span class="qo-path">${escapeHtml(o.sub)}</span></div>`;
  }).join("") || `<div class="qo-empty">无匹配</div>`;
  const sel = res.querySelector(".qo-item.sel");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}
function quickOpenPick() {
  const o = qoResults[qoIdx];
  if (!o || !o.target) return;
  quickOpenClose();
  pushNav(o.target, o.line);
  openTab(o.target, { focus: true, line: o.line });
}
$("#qo-input").addEventListener("input", (e) => quickFilter(e.target.value));
$("#qo-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); quickOpenPick(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); if (qoResults.length) { qoIdx = (qoIdx + 1) % qoResults.length; renderQuickResults(); } }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (qoResults.length) { qoIdx = (qoIdx - 1 + qoResults.length) % qoResults.length; renderQuickResults(); } }
  else if (e.key === "Escape") { e.preventDefault(); quickOpenClose(); }
});
$("#quickopen-results").addEventListener("click", (e) => {
  const item = e.target.closest(".qo-item");
  if (!item) return;

/* commit 详情（右侧面板） */
function showGitCommitDetail(data, id) {

  const d = $("#ggraph-detail");

    `<div class="ggd-msg">${escapeHtml(c.msg)}</div>`;
}
/* 数据 → gitgraph.js：主线（第一父链）+ 分支线性段；主线 commit 处挂分叉分支 */
function renderGitGraph(data) {
  const wrap = $("#ggraph-canvas-wrap");
  wrap.innerHTML = '<canvas id="ggraph-canvas"></canvas>';
  const canvas = wrap.querySelector("canvas");
  const byId = new Map(data.commits.map(c => [c.id, c]));
  const headBranch = data.headBranch && data.branches.some(b => b.name === data.headBranch)
    ? data.headBranch : (data.branches.length ? data.branches[0].name : "HEAD");
  const mainHead = data.branches.find(b => b.name === headBranch);
  const mainTip = mainHead ? mainHead.head : (data.head || "");
  // 主线：主分支头沿第一父回溯
  const mainSeq = [], seen = new Set();
  let cur = mainTip;
  while (cur && byId.has(cur) && !seen.has(cur)) { seen.add(cur); mainSeq.push(cur); cur = byId.get(cur).parents[0] || null; }
  mainSeq.reverse();
  const mainSet = new Set(mainSeq);
  // 分支线：其他分支头沿第一父回溯到主线交点
  const branchLines = [];
  for (const b of data.branches) {
    if (b.name === headBranch) continue;
    const ids = []; const s = new Set(); let c = b.head;
    while (c && byId.has(c) && !mainSet.has(c) && !s.has(c)) { s.add(c); ids.push(c); c = byId.get(c).parents[0] || null; }
    ids.reverse();
    if (ids.length) branchLines.push({ name: b.name, ids });
  }
  const tagOf = {};
  for (const t of data.tags) { (tagOf[t.head] = tagOf[t.head] || []).push(t.name); }
  const gitgraph = new GitGraph({
    elementId: "ggraph-canvas",
    orientation: "vertical",
    template: {
      colors: ["#79c0ff", "#f0883e", "#7ee787", "#ff7b72", "#d2a8ff", "#ffa657", "#a5d6ff"],
      branch: { lineWidth: 2, spacingX: 46, color: "#79c0ff" },
      commit: {
        spacingY: 44,
        dot: { size: 12 },
        message: { color: "#c9d1d9", font: "12px sans-serif" },
        hash: { color: "#8b949e", font: "10px monospace" },
        tag: { color: "#1a1a1a", background: "#ffd33d", font: "10px sans-serif" },
      },
      arrow: { size: 6, color: "#58a6ff" },
    },
  });
  const master = gitgraph.branch(headBranch);
  const commitOf = (id) => {
    const c = byId.get(id);
    const opts = {
      message: (c.msg.split("\n")[0]).slice(0, 60), hash: id,
      onClick: () => showGitCommitDetail(data, id),   // 1.6 的 commit onClick 走 options
    };
    if (tagOf[id]) opts.tag = tagOf[id].join(",");
    return opts;
  };
  // 主线逐 commit，分叉点挂分支
  const usedBranch = new Set();
  for (let i = 0; i < mainSeq.length; i++) {
    const id = mainSeq[i];
    master.commit(commitOf(id));
    for (const bl of branchLines) {
      if (usedBranch.has(bl.name)) continue;
      const firstParent = byId.get(bl.ids[0]).parents[0];
      if (firstParent === id) {
        usedBranch.add(bl.name);
        const br = gitgraph.branch(bl.name);
        for (const bid of bl.ids) br.commit(commitOf(bid));
      }
    }
  }
  // 主线未覆盖到的分支（孤儿/主线截断）：最后追加
  for (const bl of branchLines) {
    if (usedBranch.has(bl.name)) continue;
    const br = gitgraph.branch(bl.name);
    for (const bid of bl.ids) br.commit(commitOf(bid));
  }
  // 无任何引用（空仓库）时给个占位
  if (!mainSeq.length && !branchLines.length && data.commits.length) {
    const br = gitgraph.branch("commits");
    for (const c of data.commits) br.commit(commitOf(c.id));
  }
  /* 点击命中：gitgraph 自带 hitTest 在 devicePixelRatio≠1 时坐标偏差，这里按显示坐标公式自算。
     翻转布局（spacingX/Y>0）下 commit 显示坐标 = (canvasW - marginX - d.x, canvasH - marginY - d.y)；
     marginX = spacingX + 2*dot.size，marginY = spacingY + 2*dot.size。 */
  const mX = 46 + 2 * 12, mY = 44 + 2 * 12;
  canvas.addEventListener("click", (ev) => {
    const r = canvas.getBoundingClientRect();
    const ex = ev.clientX - r.left, ey = ev.clientY - r.top;
    for (const c of gitgraph.commits) {
      const cx = r.width - mX - c.x, cy = r.height - mY - c.y;
      if (Math.abs(cx - ex) <= 14 && Math.abs(cy - ey) <= 14) {
        if (c.onClick) c.onClick();
        return;
      }
    }
  });
}

let peekState = { el: null };

async function peekDefinition(src, info, x, y) {
  peekClose();
  let res = null;
  try {
    const r = await fetch("/api/java/def", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        path: src.path, line: info.lineNo, col: info.col,
        text: src.text,
        branch: src.view && src.view.isBranch ? src.view.commit : null,
        commit: src.view && !src.view.isBranch ? src.view.commit : null,
        name: info.name, kind: info.kind,
      }),
    }).catch(() => null);
    res = r && r.ok ? await r.json().catch(() => null) : null;
  } catch (e) { res = null; }
  if (!res || res.error || res.file == null) { toast("未找到定义", "err"); return; }
  const code = await api("/api/code?path=" + encodeURIComponent(res.file)).catch(() => null);
  if (!code) return;
  const lines = code.content.split("\n");
  const ln = res.line || 1;
  const from = Math.max(0, ln - 6), to = Math.min(lines.length, ln + 5);
  const frag = lines.slice(from, to).map((t, i) => {
    const n = from + i + 1;
    return `<div class="pk-line${n === ln ? " cur" : ""}"><span class="pk-no">${n}</span><code>${escapeHtml(t)}</code></div>`;
  }).join("");
  const el = document.createElement("div");

  el.innerHTML =
    `<div class="pk-head"><span class="pk-file">${escapeHtml(res.file.split("/").pop())} · 第 ${ln} 行</span>` +
    `<button class="pk-jump" title="跳转到定义">跳转</button><button class="pk-close" title="关闭">✕</button></div>` +
    `<div class="pk-body">${frag}</div>`;
  document.body.appendChild(el);
  const rw = el.offsetWidth, rh = el.offsetHeight;
  let px = x + 14, py = y + 14;
  if (px + rw > window.innerWidth - 8) px = Math.max(8, x - rw - 14);
  if (py + rh > window.innerHeight - 8) py = Math.max(8, y - rh - 14);
  el.style.left = px + "px"; el.style.top = py + "px";

  el.querySelector(".pk-jump").onclick = () => { const f = res.file; peekClose(); pushNav(f, ln); openTab(f, { focus: true, line: ln }); };
  el.querySelector(".pk-close").onclick = peekClose;
}

/* 代码折叠（Ctrl+Shift+[ 折叠 / Ctrl+Shift+] 展开）：持久化 {path: {startLine: endLine}}。
   仅对非虚拟滚动（小文件）生效；大文件虚拟滚动不折叠。 */
const FOLD_KEY = "mdreader.folds.v1";
let folds = {};
try { folds = JSON.parse(localStorage.getItem(FOLD_KEY) || "{}"); } catch (e) { folds = {}; }
if (!folds || typeof folds !== "object" || Array.isArray(folds)) folds = {};
function saveFolds() { try { localStorage.setItem(FOLD_KEY, JSON.stringify(folds)); } catch (e) { /* 静默 */ } }
/* 从 line 行开始找块边界：行内 { } 配平，返回 {start, end} 或 null */
function foldRangeFor(text, line) {
  const lines = text.split("\n");
  let depth = 0, start = -1;
  for (let i = line - 1; i < lines.length; i++) {
    const ln = lines[i] || "";
    const opens = (ln.match(/\{/g) || []).length;
    const closes = (ln.match(/\}/g) || []).length;
    if (start < 0 && opens > 0) start = i + 1;
    depth += opens - closes;
    if (start >= 0 && depth <= 0 && i + 1 > start) return { start, end: i + 1 };
  }
  return null;
}
function foldSetFor(scroll) {
  if (!scroll) return null;
  const path = scroll.id === "m-scroll" ? modalState.path : (curActiveTab() || {}).path;
  return path ? (folds[path] || null) : null;
}
/* 折叠/展开 path 中 line 所在的块；返回是否成功 */
function toggleFoldAt(path, line, text) {
  const r = foldRangeFor(text, line);
  if (!r) return false;
  const m = folds[path] || (folds[path] = {});
  if (m[r.start]) delete m[r.start]; else m[r.start] = r.end;
  saveFolds();
  return true;
}
function unfoldAt(path, line) {
  const m = folds[path];
  if (!m) return false;
  // 该行是折叠起点 → 展开；否则找包含该行的区间展开
  if (m[line]) { delete m[line]; saveFolds(); return true; }
  for (const s of Object.keys(m)) {
    if (line > parseInt(s, 10) && line <= m[s]) { delete m[s]; saveFolds(); return true; }
  }
  return false;
}
/* 重渲染当前代码视图（折叠状态变化后） */
function rerenderCodeView(path) {

/* 括号配对高亮：点击代码括号 → 配对两端所在行左右黄边（阅读大文件块结构用） */
function clearBracketPair() {
  document.querySelectorAll("#m-scroll .cl-line.brack-pair, #ct-scroll .cl-line.brack-pair")
    .forEach(el => el.classList.remove("brack-pair"));
}
/* 在全文里找 ch 在 (line,col) 的配对位置；返回 {line, col} 或 null */
function matchBracket(text, line, col) {
  const lines = text.split("\n");
  const ln = lines[line - 1] || "";
  const ch = ln[col - 1];
  if (!ch || !"()[]{}".includes(ch)) return null;
  const open = { "(": ")", "[": "]", "{": "}" };
  const close = { ")": "(", "]": "[", "}": "{" };
  let target, dir;
  if (open[ch]) { target = open[ch]; dir = 1; }
  else if (close[ch]) { target = close[ch]; dir = -1; }
  else return null;
  let depth = 0, i = line - 1, j = col - 1 + dir;
  while (i >= 0 && i < lines.length) {
    const l = lines[i] || "";
    while (j >= 0 && j < l.length) {
      const c = l[j];
      if (c === ch) depth++;
      else if (c === target) {
        if (depth === 0) return { line: i + 1, col: j + 1 };
        depth--;
      }
      j += dir;
    }
    i += dir;
    j = dir === 1 ? 0 : ((lines[i] || "").length - 1);
  }
  return null;
}
document.addEventListener("click", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  const code = e.target.closest ? e.target.closest(".cl-code") : null;
  if (!code) { clearBracketPair(); return; }
  const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
  if (!r || r.startContainer.nodeType !== 3) { clearBracketPair(); return; }
  // 行内列号：caret 在 cl-code 全文中的位置（含行模板前缀 "  "），减前缀得真实代码列
  const range = document.createRange();
  range.selectNodeContents(code);
  range.setEnd(r.startContainer, r.startOffset);
  const globalIdx = range.toString().length;
  const ch = code.textContent[globalIdx];
  if (!ch || !"()[]{}".includes(ch)) { clearBracketPair(); return; }
  const lineDiv = code.closest(".cl-line");
  const line = parseInt(lineDiv.dataset.line, 10);
  if (!line) return;
  const text = (lineDiv.closest("#m-scroll") ? modalViewText() : tabViewText(curActiveTab())) || "";
  const col = globalIdx - 2 + 1;   // 前缀 = sign(1 或 +/−) + 空格(1) = 2 字符
  const pair = matchBracket(text, line, col);
  if (!pair) { clearBracketPair(); return; }
  clearBracketPair();
  const container = lineDiv.closest("#m-scroll") || lineDiv.closest("#ct-scroll");
  if (!container) return;
  const hl = (ln) => {
    const row = container.querySelector(`.cl-line[data-line="${ln}"]`);

  hl(line);
  if (pair.line !== line) hl(pair.line);
}, false);

function projectsBtnText() {
  const b = $("#btn-projects");
  if (!b) return;
  fetch("/api/projects").then(r => r.json()).then(d => {
    b.textContent = d.current ? "项目: " + d.current : (d.projects.length > 1 ? "项目(全部)" : "项目");
    b.title = d.current ? ("当前项目 " + d.current + "（Alt+P 管理）") : (d.projects.length > 1 ? "全部项目（Alt+P 管理）" : "项目管理（Alt+P）");
  }).catch(() => {});
}
async function refreshVtops() {
  try {
    const meta = await (await fetch("/api/meta")).json();
    _vtops = (meta && meta.roots || []).map(r => r.name);
  } catch (e) { /* 保持旧值 */ }
}
async function loadProjects() {
  const list = $("#projects-list");
  try {
    const d = await (await fetch("/api/projects")).json();
    $("#projects-footer").textContent = d.single
      ? "当前为单项目模式；添加第二个项目后目录树顶层显示项目列表，可切换。"
      : "点击项目名切换（目录树顶层跟随）；切换后已打开的标签页保留。";
    list.innerHTML = "";
    if (!d.projects.length) { list.innerHTML = '<div style="padding:12px;color:var(--fg-dim)">暂无项目</div>'; return; }
    // 当前项目高亮时提供"全部项目"聚合入口
    if (d.current) {
      const all = document.createElement("div");
      all.className = "proj-item";
      all.innerHTML = `<span class="proj-name">全部项目</span><span class="proj-path">顶层聚合显示所有项目</span>` +
        `<span class="proj-ops"><button class="proj-switch">切换</button></span>`;
      all.querySelector(".proj-switch").addEventListener("click", (e) => { e.stopPropagation(); switchProject(""); });
      all.addEventListener("click", () => switchProject(""));
      list.appendChild(all);
    }
    for (const p of d.projects) {
      const item = document.createElement("div");
      item.className = "proj-item" + (p.name === d.current ? " cur" : "");
      const isCur = p.name === d.current;
      item.innerHTML =
        `<span class="proj-name">${escapeHtml(p.name)}${isCur ? " ✓" : ""}</span>` +
        `<span class="proj-path" title="${escapeHtml(p.path)}">${escapeHtml(p.path)}</span>` +
        `<span class="proj-ops">` +
        (!isCur ? `<button class="proj-switch" data-name="${escapeHtml(p.name)}">切换</button>` : "") +
        (d.projects.length > 1 ? `<button class="proj-remove" data-name="${escapeHtml(p.name)}">移除</button>` : "") +
        `</span>`;
      item.querySelector(".proj-switch")?.addEventListener("click", (e) => { e.stopPropagation(); switchProject(p.name); });
      item.querySelector(".proj-remove")?.addEventListener("click", (e) => { e.stopPropagation(); removeProject(p.name); });
      if (!isCur) item.addEventListener("click", () => switchProject(p.name));
      list.appendChild(item);
    }
  } catch (e) {
    list.innerHTML = `<div style="padding:12px;color:var(--red)">加载失败: ${escapeHtml(String(e))}</div>`;
  }
}
async function addProject(path) {
  path = (path || "").trim();
  if (!path) return;
  try {
    const r = await fetch("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "add", path }) });
    const d = await r.json();
    if (!r.ok || !d.ok) { alert(d.error || "添加失败"); return; }
    $("#projects-path").value = "";
    await refreshVtops();
    await Promise.all([loadProjects(), renderTree(), projectsBtnText()]);
  } catch (e) { alert("添加失败: " + e); }
}
async function switchProject(name) {
  try {
    saveState();   // 先保存当前项目任务集（写当前 key）
    const r = await fetch("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "switch", name: name || "" }) });
    const d = await r.json();
    if (!r.ok || !d.ok) { alert(d.error || "切换失败"); return; }
    _curProject = name || null;   // 任务/标签集跟随新项目
    await refreshVtops();
    loadTasksForProject();        // 载入新项目任务集并渲染/清空内容区
    loadExpanded();               // 目录树展开态按项目分区，切项目要重载
    await Promise.all([loadProjects(), renderTree(), projectsBtnText()]);
  } catch (e) { alert("切换失败: " + e); }
}
async function removeProject(name) {
  if (!confirm("移除项目 " + name + "？其标签页将关闭（不影响磁盘文件）")) return;
  try {
    const r = await fetch("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "remove", name }) });
    const d = await r.json();
    if (!r.ok || !d.ok) { alert(d.error || "移除失败"); return; }
    // 关闭该项目前缀的所有标签 —— 必须遍历「所有任务」，不能只看当前任务，
    // 否则其它任务里打开的该项目文件会变成打不开的死标签（根已从服务端移除）。
    // closeTab(id) 内部会自己定位所属任务。
    const prefix = name + "/";
    for (const tk of [...state.tasks]) {
      for (const t of [...(tk.tabs || [])]) {
        if (t.path === name || t.path.startsWith(prefix)) closeTab(t.id);
      }
    }
    // 移除的是当前项目 → 回到默认任务集（服务端 _CURRENT 已重置）
    if (_curProject === name) {
      _curProject = null;
      loadTasksForProject();
    }
    await refreshVtops();
    await Promise.all([loadProjects(), renderTree(), projectsBtnText()]);
  } catch (e) { alert("移除失败: " + e); }
}
function openProjectsPanel() {
  $("#projects-mask").style.display = "flex";
  loadProjects();
  setTimeout(() => $("#projects-path").focus(), 60);
}
function closeProjectsPanel() {
  $("#projects-mask").style.display = "none";
}
$("#btn-projects")?.addEventListener("click", openProjectsPanel);
$("#projects-close")?.addEventListener("click", closeProjectsPanel);
$("#projects-mask")?.addEventListener("click", (e) => { if (e.target === $("#projects-mask")) closeProjectsPanel(); });
$("#projects-add-btn")?.addEventListener("click", () => addProject($("#projects-path").value));
$("#projects-path")?.addEventListener("keydown", (e) => { if (e.key === "Enter") addProject(e.target.value); });

/* ================= init ================= */
(async function init() {
  try {
    const meta = await (await fetch("/api/meta")).json();
    _vtops = (meta && meta.roots || []).map(r => r.name);
    const pj = await (await fetch("/api/projects")).json();
    _curProject = pj.current || null;
    if (_curProject) loadTasksForProject();   // 有当前项目 → 载入该项目任务集（覆盖默认 key）
  } catch (e) { _vtops = []; _curProject = null; }
  loadExpanded();   // 恢复展开状态（renderTree 前）
  initTreeResizer();  // 恢复目录树宽度 + 绑定拖拽分隔条
  projectsBtnText();  // 顶栏项目按钮初始文案（当前项目/全部）
  await renderTree();
  if (curTabs().length) { renderActiveTab(); return; }
  // 默认打开最近产出的审查报告（如果存在）
  // 默认文档路径要按当前项目补 vtop 前缀：多项目下无前缀路径会被 safe_path
  // 逐根尝试，命中的可能是「另一个项目」的同名文档
  const vtp = _curProject ? _curProject + "/" : "";
  const defaultPaths = [
    vtp + "docs/审查/20260920_ck-dev-0922_vs_ck_test2.0_完整上线_codereview.md",
    vtp + "docs/梳理/00-业务全景导读.md",
  ];
  for (const p of defaultPaths) {
    try {
      const j = await api("/api/markdown?path=" + encodeURIComponent(p));
      if (j.content) { openTab(p); return; }
    } catch (e) { /* skip */ }
  }
})();
</script>
